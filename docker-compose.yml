# EULLM Platform — Docker Compose
#
# Usage:
#   docker compose up engine         # Just the inference server
#   docker compose up hub            # Just the model registry
#   docker compose up engine hub     # Engine + Hub
#   docker compose up                # All services
#
# GPU (NVIDIA):
#   docker compose --profile gpu up engine-gpu

services:
  # ── Engine (CPU) ────────────────────────────────────────────
  engine:
    build:
      context: ./engine
    image: eullm/engine:latest
    ports:
      - "11434:11434"
    volumes:
      - models:/models
      - audit:/data/audit
    restart: unless-stopped
    environment:
      # With published ports, every external client reaches the process as the
      # bridge gateway address — so the IP allowlist cannot tell them apart, and
      # widening it to the bridge subnet allows anyone who can reach the port. A
      # bearer token is the control that survives address translation, and its id
      # is what makes each audit record attributable. Uncomment and set a real
      # secret (at least 16 characters); an entry that does not parse is fatal at
      # startup, deliberately.
      #
      # EULLM_API_KEYS: "rag-prod:CHANGE-ME-a-long-random-secret:rpm=600"
      #
      # Better: mount a chmod-600 file and point at it, so the secret is neither
      # in this file nor in `docker inspect` output.
      # EULLM_API_KEYS_FILE: /run/secrets/eullm-keys
      #
      # EULLM_ALLOWED_ORIGINS: "https://chat.example.eu"
      EULLM_AUDIT_DIR: /data/audit

  # ── Engine (NVIDIA GPU) ────────────────────────────────────
  engine-gpu:
    build:
      context: ./engine
      args:
        FEATURES: cuda
    image: eullm/engine:latest-cuda
    ports:
      - "11434:11434"
    volumes:
      - models:/models
      - audit:/data/audit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - gpu
    restart: unless-stopped

  # ── Hub ─────────────────────────────────────────────────────
  hub:
    build:
      context: ./hub
    image: eullm/hub:latest
    ports:
      - "3000:3000"
    volumes:
      - models:/models
    restart: unless-stopped

  # ── Forge ───────────────────────────────────────────────────
  # Forge is a CLI tool, not a long-running service.
  # Run it with: docker compose run forge forge Qwen/Qwen3-14B --profile legal-it
  forge:
    build:
      context: ./forge
    image: eullm/forge:latest
    volumes:
      - models:/models
      - forge-output:/output
      - hf-cache:/data/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - forge

volumes:
  models:
  audit:
  forge-output:
  hf-cache:
