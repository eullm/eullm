name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Detect which components changed ──────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      hub: ${{ steps.filter.outputs.hub }}
      forge: ${{ steps.filter.outputs.forge }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'engine/**'
            hub:
              - 'hub/**'
            forge:
              - 'forge/**'

  # ── Engine ───────────────────────────────────────────────────────────
  engine:
    name: Engine (build + test)
    needs: changes
    if: needs.changes.outputs.engine == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine -> target"
      - name: Install dependencies
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential pkg-config libssl-dev
      - name: Build
        working-directory: engine
        run: cargo build
      - name: Test
        working-directory: engine
        run: cargo test
      - name: Clippy
        working-directory: engine
        run: cargo clippy -- -D warnings -A dead-code -A unused-imports

  # ── Hub ──────────────────────────────────────────────────────────────
  hub:
    name: Hub (build + test)
    needs: changes
    if: needs.changes.outputs.hub == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "hub -> target"
      - name: Build
        working-directory: hub
        run: cargo build
      - name: Test
        working-directory: hub
        run: cargo test

  # ── Forge ────────────────────────────────────────────────────────────
  forge:
    name: Forge (lint + test)
    needs: changes
    if: needs.changes.outputs.forge == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-forge-${{ hashFiles('forge/pyproject.toml') }}
          restore-keys: pip-forge-
      - name: Install
        working-directory: forge
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: forge
        run: ruff check eullm_forge/
      - name: Test
        working-directory: forge
        run: pytest -v

  # ── Engine TurboQuant (experimental) ────────────────────────────────
  engine-turboquant:
    name: Engine TurboQuant (experimental)
    needs: changes
    if: needs.changes.outputs.engine == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Cache cargo registry + git sources
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-

      # Cache the vendored TurboQuant llama.cpp only (small, ~100 MB)
      # Key includes setup script hash so a version bump invalidates cache
      - uses: actions/cache@v4
        id: vendor-cache
        with:
          path: engine/vendor
          key: tq-vendor-${{ runner.os }}-${{ hashFiles('engine/scripts/setup-turboquant.sh') }}
          restore-keys: tq-vendor-${{ runner.os }}-

      # sccache: caches individual C++/Rust .o files — replaces target/ cache
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Install dependencies
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential pkg-config libssl-dev

      - name: Setup TurboQuant backend
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        working-directory: engine
        run: |
          cargo fetch
          bash scripts/setup-turboquant.sh
          echo "--- Workspace Cargo.toml patch section ---"
          grep -A2 'patch.crates-io' ../Cargo.toml || echo "NO PATCH FOUND"
          echo "--- cargo tree llama-cpp-sys-2 ---"
          cargo tree -i llama-cpp-sys-2 2>&1 | head -5

      - name: Re-activate Cargo patch (cache hit)
        if: steps.vendor-cache.outputs.cache-hit == 'true'
        working-directory: engine
        run: |
          if ! grep -q '^\[patch.crates-io\]' ../Cargo.toml; then
            bash scripts/setup-turboquant.sh
          else
            echo "Cargo patch already active (vendor cache hit)."
          fi

      - name: Build (turboquant)
        working-directory: engine
        run: cargo build --features turboquant
        env:
          RUSTC_WRAPPER: sccache
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          SCCACHE_GHA_ENABLED: "true"
      - name: Build (turboquant_native)
        working-directory: engine
        run: cargo build --features turboquant_native
        env:
          RUSTC_WRAPPER: sccache
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          SCCACHE_GHA_ENABLED: "true"
      - name: Test
        working-directory: engine
        run: cargo test --features turboquant_native
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
      - name: Clippy
        working-directory: engine
        run: cargo clippy --features turboquant_native -- -D warnings -A dead-code -A unused-imports
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
