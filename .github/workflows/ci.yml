name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Force any JS-based action still pinned to Node 20 to run on Node 24.
  # Documented escape hatch from GitHub's Node 20 deprecation notice
  # (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/).
  # Needed today because KyleMayes/install-llvm-action has not yet shipped
  # a v3 with a Node 24 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Detect which components changed ──────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      hub: ${{ steps.filter.outputs.hub }}
      forge: ${{ steps.filter.outputs.forge }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            engine:
              - 'engine/**'
            hub:
              - 'hub/**'
            forge:
              - 'forge/**'

  # ── Engine ───────────────────────────────────────────────────────────
  engine:
    name: Engine (build + test)
    needs: changes
    if: needs.changes.outputs.engine == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine -> target"
      - name: Install dependencies
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential pkg-config libssl-dev
      - name: Build
        working-directory: engine
        run: cargo build
      - name: Test
        working-directory: engine
        run: cargo test
      - name: Clippy
        working-directory: engine
        run: cargo clippy -- -D warnings -A dead-code -A unused-imports

  # ── Hub ──────────────────────────────────────────────────────────────
  hub:
    name: Hub (build + test)
    needs: changes
    if: needs.changes.outputs.hub == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "hub -> target"
      - name: Build
        working-directory: hub
        run: cargo build
      - name: Test
        working-directory: hub
        run: cargo test

  # ── Forge ────────────────────────────────────────────────────────────
  forge:
    name: Forge (lint + test)
    needs: changes
    if: needs.changes.outputs.forge == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-forge-${{ hashFiles('forge/pyproject.toml') }}
          restore-keys: pip-forge-
      - name: Install
        working-directory: forge
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: forge
        run: ruff check eullm_forge/
      - name: Test
        working-directory: forge
        run: pytest -v

  # ── Engine TurboQuant (experimental) ────────────────────────────────
  engine-turboquant:
    name: Engine TurboQuant (experimental)
    needs: changes
    if: needs.changes.outputs.engine == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # Cache cargo registry + git sources
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-

      # Cache vendored TurboQuant llama.cpp only (small, ~100 MB)
      # Key includes setup script hash so a version bump invalidates cache
      - uses: actions/cache@v5
        id: vendor-cache
        with:
          path: engine/vendor
          key: tq-vendor-${{ runner.os }}-${{ hashFiles('engine/scripts/setup-turboquant.sh') }}
          restore-keys: tq-vendor-${{ runner.os }}-

      # sccache: disk cache persisted via actions/cache — no GHA cache API dependency at runtime
      - uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: sccache-tq-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'engine/scripts/setup-turboquant.sh') }}
          restore-keys: sccache-tq-${{ runner.os }}-

      - name: Setup sccache
        run: |
          SCCACHE_VER=0.8.0
          TMPSC=$(mktemp -d)
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VER}/sccache-v${SCCACHE_VER}-x86_64-unknown-linux-musl.tar.gz" \
            -o "${TMPSC}/sccache.tar.gz"
          tar -xzf "${TMPSC}/sccache.tar.gz" -C "${TMPSC}"
          find "${TMPSC}" -maxdepth 2 -name sccache -type f -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/sccache
          rm -rf "${TMPSC}"
          mkdir -p ~/.cache/sccache
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          sccache --version

      - name: Install dependencies
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential pkg-config libssl-dev

      - name: Setup TurboQuant backend
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        working-directory: engine
        run: |
          cargo fetch
          bash scripts/setup-turboquant.sh
          echo "--- Workspace Cargo.toml patch section ---"
          grep -A2 'patch.crates-io' ../Cargo.toml || echo "NO PATCH FOUND"
          echo "--- cargo tree llama-cpp-sys-2 ---"
          cargo tree -i llama-cpp-sys-2 2>&1 | head -5

      - name: Re-activate Cargo patch (cache hit)
        if: steps.vendor-cache.outputs.cache-hit == 'true'
        working-directory: engine
        run: |
          # When the vendor cache hits, engine/vendor/llama-cpp-sys-2 is
          # restored but Cargo.toml at the workspace root is whatever was
          # checked out from git — and we deliberately don't commit the
          # [patch.crates-io] section (it's a runtime/build-time graft).
          # If the patch isn't there, just append it. Don't run the full
          # setup-turboquant.sh on this path: that script assumes a clean
          # slate and tries to re-fetch llama-cpp-sys-2 from the registry
          # src/ directory, which fails on the cache-hit path because the
          # registry src/ hasn't been extracted yet.
          if grep -q '^\[patch.crates-io\]' ../Cargo.toml; then
            echo "Cargo patch already active (vendor cache hit)."
          elif [ -d vendor/llama-cpp-sys-2 ]; then
            echo "Vendor cache hit but [patch.crates-io] missing in Cargo.toml; appending..."
            printf '\n[patch.crates-io]\nllama-cpp-sys-2 = { path = "engine/vendor/llama-cpp-sys-2" }\n' >> ../Cargo.toml
            echo "Verifying:"
            grep -A2 '^\[patch.crates-io\]' ../Cargo.toml
          else
            echo "ERROR: vendor cache hit but engine/vendor/llama-cpp-sys-2 is missing"
            exit 1
          fi

      - name: Build (turboquant)
        working-directory: engine
        run: cargo build --features turboquant
      - name: Build (turboquant_native)
        working-directory: engine
        run: cargo build --features turboquant_native
      - name: Test
        working-directory: engine
        run: cargo test --features turboquant_native
      - name: Clippy
        working-directory: engine
        run: cargo clippy --features turboquant_native -- -D warnings -A dead-code -A unused-imports

  # ── Windows installer pre-flight (FAST, <2 min, runs on every push) ──
  # Catches Inno Setup script bugs (undefined constants, syntax errors,
  # missing files) without waiting for a 2h+ tag-triggered release build.
  # Uses dummy 100-byte staging files so the bundle is tiny but the
  # installer compile exercises the full eullm.iss script.
  installer-preflight:
    name: Installer pre-flight (Inno Setup syntax check)
    needs: changes
    # Run when the installer dir or the release workflow changes; also
    # on any push to main (to catch drift in the .iss script).
    if: github.event_name == 'push'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Stage dummy files for all 3 variants
        shell: pwsh
        run: |
          foreach ($variant in @("cpu", "cuda", "tq")) {
            New-Item -ItemType Directory -Force -Path "installer\staging\$variant" | Out-Null
            # Dummy 100-byte exe so Inno Setup has something to package
            [System.IO.File]::WriteAllBytes(
              "installer\staging\$variant\eullm.exe",
              (1..100 | ForEach-Object { 0 })
            )
            if ($variant -ne "cpu") {
              foreach ($dll in @("cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll")) {
                [System.IO.File]::WriteAllBytes(
                  "installer\staging\$variant\$dll",
                  (1..100 | ForEach-Object { 0 })
                )
              }
            }
          }
          Get-ChildItem installer\staging -Recurse | Format-Table FullName, Length

      - name: Compile CPU installer (syntax check only)
        shell: pwsh
        working-directory: installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
              /DMyVariant=CPU `
              /DMyAppVersion=0.0.0-preflight `
              /DMyStagingDir=staging\cpu `
              eullm.iss

      - name: Compile CUDA installer (syntax check only)
        shell: pwsh
        working-directory: installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
              /DMyVariant=CUDA `
              /DMyAppVersion=0.0.0-preflight `
              /DMyStagingDir=staging\cuda `
              eullm.iss

      - name: Compile CUDA+TurboQuant installer (syntax check only)
        shell: pwsh
        working-directory: installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
              /DMyVariant=CUDA-TurboQuant `
              /DMyAppVersion=0.0.0-preflight `
              /DMyStagingDir=staging\tq `
              eullm.iss
