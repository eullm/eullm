name: Release Engine

on:
  push:
    tags:
      - "engine-v*"
      - "EuLLM-v*"
  # Manual dispatch runs only build-arm-cix-p1 and build-vulkan, so either can
  # be iterated on from the Actions tab without a real tag, without paying for
  # the rest of the release matrix (Windows CUDA alone is a ~50 min cold
  # build), and without ever creating a GitHub Release (the `release` job only
  # runs on an actual tag push).
  workflow_dispatch: {}

permissions:
  contents: write

# Deleting a tag and re-pushing it is the normal way to retry a release, and
# without this that fires a SECOND workflow run while the first is still
# building — up to ~50 min for Windows CUDA cold — leaving two runs racing to
# attach assets to the same release. Same tag means same intent, so the newer
# run wins and the stale one is cancelled. `release` already refuses to run on a
# cancelled workflow (its `if:` starts with `!cancelled()`), so the abandoned
# run cannot publish on its way out.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Force any JS-based action still pinned to Node 20 to run on Node 24.
  # Documented escape hatch from GitHub's Node 20 deprecation notice
  # (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/).
  # Needed today because KyleMayes/install-llvm-action has not yet shipped
  # a v3 with a Node 24 runtime — without this flag the workflow emits a
  # deprecation warning on every run and would break on June 16, 2026 when
  # Node 20 is forced off.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  # ── sccache → S3 backend on EU-hosted MinIO (ci.eullm.eu) ──────────────
  # WHY S3 and not GitHub's free Actions cache: the Actions cache is
  # REF-SCOPED. A run triggered by a tag (our releases fire on EuLLM-v*) can
  # only restore caches saved on that same tag ref or on the default branch —
  # NOT caches saved by other tags. So a GitHub-cache sccache never hits across
  # releases: v0.5.11 populated 865 MiB under its tag, v0.5.12 (different tag)
  # couldn't see it and rebuilt cold (38 min Linux CUDA). S3 is a GLOBAL,
  # content-addressed store with no ref boundary → it hits across every release
  # (proven in v0.5.9: 129 CUDA hits, 2m34s Linux CUDA, "Cache location: s3").
  # Do NOT move sccache back to the GitHub cache for the release workflow.
  SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
  SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
  SCCACHE_REGION: us-east-1
  SCCACHE_S3_USE_SSL: "true"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  # Keep the sccache daemon alive for the WHOLE build (default 600s idle
  # shutdown can kill long jobs mid-build, then a fresh daemon re-handshakes
  # with S3 and a blip prints "Timed out waiting for server startup").
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  # ── Gate: the tagged commit must have green CI before anything is published ──
  #
  # This workflow fires on a tag and, until now, had no relationship to ci.yml
  # whatsoever: a tag placed on a commit whose CI had failed — or had not
  # finished yet — still produced 13 published binaries. Normally a red `main`
  # is corrected with another commit; here it becomes an artifact users
  # download, which is the one point where noticing a problem after the merge
  # rather than before actually costs something.
  #
  # Deliberately gates the `release` job ONLY, not the builds. Compiling from an
  # unverified commit wastes nothing that matters (standard runners on a public
  # repo are free) and keeping the six build jobs untouched keeps this change
  # small in the workflow that has historically been the most expensive place
  # to get something wrong. What must never happen is *publishing* from it.
  #
  # Waits rather than failing fast, because pushing a tag right after a merge is
  # normal and CI takes ~7 minutes: a "not finished yet" is not a red build.
  require_green_ci:
    name: Require green CI on the tagged commit
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    steps:
      - name: Wait for ci.yml on this commit and require success
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 900 ))   # 15 min: CI is ~7, leaves slack
          while :; do
            run=$(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion // "pending") \(.html_url)"')

            if [ -z "$run" ]; then
              echo "::error::No ci.yml run found for $SHA. A release must be tagged on a commit that CI has actually validated (normally a commit on main). Push the commit to main, let CI finish, then re-tag."
              exit 1
            fi

            status=$(echo "$run" | cut -d' ' -f1)
            conclusion=$(echo "$run" | cut -d' ' -f2)
            url=$(echo "$run" | cut -d' ' -f3)
            echo "ci.yml for $SHA: status=$status conclusion=$conclusion"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI is green — release may proceed. $url"
                exit 0
              fi
              echo "::error::CI on $SHA concluded '$conclusion'. Refusing to publish binaries from an unverified commit. $url"
              exit 1
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CI on $SHA is still '$status' after 15 minutes. Not publishing on an unknown result. $url"
              exit 1
            fi
            sleep 30
          done

  # ── Gate: the tag must name the version the crate actually reports ──────────
  #
  # A tag is pushed by hand, and the version bump is a separate commit. Get the
  # order wrong and the release publishes binaries that answer with the previous
  # version: v0.6.43 shipped nine binaries reporting 0.6.42, because the bump
  # landed one merge after the tag. Nothing failed, nothing looked wrong, and
  # the mismatch is only visible by running `-V` on a downloaded artifact.
  #
  # Deliberately cheap and first: it finishes in seconds, so a bad tag is red
  # long before the long-pole builds are done and can be deleted and re-pushed
  # (the workflow's concurrency group cancels the stale run). Like
  # require_green_ci it gates `release` only — compiling from a mis-tagged
  # commit wastes nothing that matters, publishing from one does.
  require_version_match:
    name: Require the tag to match engine/Cargo.toml
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Compare the tag with the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#EuLLM-v}"
          want="${want#engine-v}"
          # Anchored: a dependency's version is `foo = { version = "…" }` or
          # `foo = "…"`, never a line starting with `version`.
          have=$(grep -m1 '^version = ' engine/Cargo.toml | cut -d'"' -f2)
          echo "tag says $want, engine/Cargo.toml says $have"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $TAG does not match engine/Cargo.toml ($have). Bump the version, merge it to main, and tag that commit. Delete this tag and push it again once the bump is in: git tag -d $TAG && git push origin :refs/tags/$TAG"
            exit 1
          fi

  build:
    # Manual dispatch is for testing build-arm-cix-p1 in isolation - skip
    # the rest of the matrix there.
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: eullm-linux-x64
            # x86-64-v3 (Intel Haswell 2013+ / AMD Zen 2017+): baseline AVX2/FMA
            # so llama-cpp-sys-2's build.rs (reads CARGO_CFG_TARGET_FEATURE)
            # actually turns on GGML_AVX2 in llama.cpp's CPU backend. Without
            # this, Rust's default x86_64 target features are SSE-only, so the
            # published CPU-only binary silently runs llama.cpp's much slower,
            # far-less-used no-AVX2 fallback kernels regardless of the actual
            # CPU — confirmed via `rustc --print cfg`, and reproduced on real
            # hardware in issue #140 (1.16 tok/s on a 12-core Haswell-class i9
            # that fully supports AVX2). CPUs older than this floor get a hard
            # SIGILL crash instead of a slow-but-working binary — see
            # docs/x86-64-baseline.md for the compatibility trade-off writeup.
            rustflags: "-C target-cpu=x86-64-v3"
            features: multimodal
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: eullm-linux-arm64
            features: multimodal
          - target: x86_64-apple-darwin
            # Native Intel runner, NOT macos-15 (Apple Silicon) with a
            # cross-compile. This was the last unexamined variable behind the
            # all-NaN logits reported on two Intel Macs in issue #140: this
            # artifact was the only one in the matrix built for an architecture
            # its runner does not have, and llama.cpp upstream deliberately
            # builds its own macOS x64 release on macos-15-intel rather than
            # cross-compiling it. GGML_NATIVE is off either way (build.rs turns
            # it off whenever target-cpu != native), but a native host removes
            # the whole class of host/target confusion from the CPU backend's
            # CMake feature detection. macos-15-intel is GA until Aug 2027 and
            # is the last x86_64 macOS image GitHub will offer; macos-13 is
            # retired. Keep this in step with upstream's choice of runner.
            os: macos-15-intel
            artifact: eullm-macos-x64
            # Same x86-64-v3 baseline as eullm-linux-x64 above — see that
            # entry's comment.
            #
            # This target carries no `metal` feature, and from v0.6.39 that
            # genuinely means no Metal. Between v0.6.30 and v0.6.38 it did
            # not: ggml's CMake enables the Metal backend on every Apple
            # target regardless of cargo features, so dropping the feature
            # changed nothing and this binary kept offloading whole models
            # onto Intel-Mac GPUs (issue #140). llama-cpp-sys-2's build.rs now
            # passes -DGGML_METAL=OFF when the feature is absent, matching how
            # llama.cpp builds its own macOS x64 release. `multimodal` is
            # unrelated to that: it compiles llama.cpp's mtmd helper and
            # touches no backend.
            rustflags: "-C target-cpu=x86-64-v3"
            features: multimodal
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: eullm-macos-arm64
            features: metal,multimodal

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # llama.cpp submodule under engine/vendor/llama-cpp-rs/llama-cpp-sys-2/
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # sccache now uses S3 backend on our EU-hosted MinIO — no local
      # actions/cache layer needed. See workflow-level env block for config.

      - name: Install sccache
        shell: bash
        run: |
          SCCACHE_VER=0.8.0
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          if [ "$OS" = "linux" ]; then
            TRIPLE="x86_64-unknown-linux-musl"
          elif [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ]; then
            TRIPLE="aarch64-apple-darwin"
          else
            TRIPLE="x86_64-apple-darwin"
          fi
          # Use mktemp+find to avoid --wildcards which doesn't exist on BSD tar (macOS)
          TMPSC=$(mktemp -d)
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VER}/sccache-v${SCCACHE_VER}-${TRIPLE}.tar.gz" \
            -o "${TMPSC}/sccache.tar.gz"
          tar -xzf "${TMPSC}/sccache.tar.gz" -C "${TMPSC}"
          find "${TMPSC}" -maxdepth 2 -name sccache -type f -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/sccache
          rm -rf "${TMPSC}"
          # Route compiler invocations through sccache (configured via the
          # workflow-level SCCACHE_BUCKET / SCCACHE_ENDPOINT env vars).
          # Only route compilers through sccache if the S3 backend is actually
          # reachable. A backend outage must degrade to a cache-less (slower)
          # build, never fail it. (v0.5.5 died at exit 101 when the endpoint
          # vanished mid-build; this is the belt to that suspenders.)
          if curl -sSf -m 10 "${SCCACHE_ENDPOINT}/minio/health/live" >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "CMAKE_CUDA_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "sccache: S3 backend reachable — caching enabled."
          else
            echo "::warning::sccache S3 backend (${SCCACHE_ENDPOINT}) unreachable — building WITHOUT cache (slower, but the build will not fail)."
          fi
          sccache --version
          sccache --start-server || true
          sccache --show-stats || true

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential pkg-config libssl-dev

      - name: Build engine
        env:
          # Set only on the x86_64 CPU-only matrix entries (see their
          # `rustflags` comment above) — unset/empty for arm64, which
          # doesn't need or use it. See docs/x86-64-baseline.md.
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }} -p eullm-engine

      - name: sccache stats (visibility into S3 hit/miss)
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Package binary
        run: |
          cp target/${{ matrix.target }}/release/eullm ${{ matrix.artifact }}
          strip --strip-all ${{ matrix.artifact }} 2>/dev/null || strip -x ${{ matrix.artifact }} 2>/dev/null || true
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ── Vulkan: the GPU build for everything that is not NVIDIA ────────────────
  #
  # Added after the first Vulkan report we ever received (issue #286), from an
  # AMD Ryzen with Radeon integrated graphics: the user had to build it himself
  # because we published CPU-only and CUDA and nothing else. That leaves out
  # every AMD and Intel GPU, and in particular the unified-memory machines where
  # the GPU can address far more than any consumer discrete card.
  #
  # Vulkan is a loader, not a toolkit: the binary links `libvulkan.so.1` and the
  # driver comes from the user's system (mesa RADV / amdvlk / NVIDIA / Intel
  # ANV). So this needs the headers and `glslc` at build time, and nothing is
  # bundled into the release beyond the binary itself — unlike CUDA, where we
  # ship the runtime DLLs. A machine without a Vulkan driver gets a clear
  # loader error rather than a broken binary.
  # No `if:` guard, unlike the other build jobs: this one also runs on a manual
  # workflow_dispatch, so a change to the Vulkan toolchain can be validated from
  # the Actions tab without spending a release. The first attempt at this job
  # died on `apt-get install glslc`, a package jammy does not have, and took
  # v0.6.46's Vulkan binary with it. `release` still only runs on a real tag, so
  # a dispatch publishes nothing.
  build-vulkan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu-vulkan

      # ggml-vulkan compiles its shaders at build time and needs `glslc`, which
      # jammy does not package: `apt-get install glslc` fails with "unable to
      # locate package" and took a release with it. The LunarG repository is
      # where it comes from on 22.04, and is what llama.cpp's own release
      # workflow uses for this exact runner. Ubuntu 24.04 does have a `glslc`
      # package, but moving this build there would raise the glibc floor of a
      # published binary above every other Linux artifact we ship — the reason
      # they are all built on 22.04 in the first place.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y wget gnupg
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/lunarg.gpg
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake build-essential pkg-config libssl-dev vulkan-sdk
          glslc --version

      - name: Build engine (Vulkan)
        env:
          # Same x86-64-v3 baseline as the other x86_64 Linux binaries: the CPU
          # still runs everything the GPU does not. See docs/x86-64-baseline.md.
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: cargo build --release --features vulkan -p eullm-engine

      - name: Package binary
        run: |
          cp target/release/eullm eullm-linux-x64-vulkan
          strip --strip-all eullm-linux-x64-vulkan || true
          chmod +x eullm-linux-x64-vulkan
          # Prove the backend is actually inside the binary. The check is on
          # ggml's own symbols rather than on `ldd`, because the Vulkan loader
          # can be reached either by linking libvulkan or by dlopen, and only
          # one of those shows up in the link table — a check that reads the
          # wrong one either passes a hollow binary or fails a good one. This
          # is the same discriminating test that settled the Metal case: what
          # the binary contains, not what the build was asked to contain.
          if ! strings eullm-linux-x64-vulkan | grep -q ggml_vk_; then
            echo "::error::no ggml_vk_* symbols in the binary — the Vulkan backend was not compiled in"
            exit 1
          fi
          echo "Vulkan symbols present: $(strings eullm-linux-x64-vulkan | grep -c ggml_vk_)"
          ldd eullm-linux-x64-vulkan | grep -i vulkan || echo "note: libvulkan is not in the link table (loader reached via dlopen)"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eullm-linux-x64-vulkan
          path: eullm-linux-x64-vulkan

  build-cuda:
    if: ${{ github.event_name == 'push' }}
    strategy:
      matrix:
        include:
          # CUDA 13 rather than 12.8. Two reasons, both about size: NVIDIA
          # dropped library support below sm_75 in 13.0, so the static math
          # libraries no longer carry Maxwell/Pascal/Volta kernels at all, and
          # everything we still don't need gets pruned below. The cost is the
          # minimum driver moving from r570 to r580 — an August 2025 driver,
          # and any card this binary can run on (RTX 3000/4000/5000) is on a
          # newer one already.
          - cuda: "13.1.2"
            artifact: eullm-linux-x64-cuda-13.1
            cuda_tag: "13.1.2-devel-ubuntu22.04"
            cuda_archs: "86;89;120"
          # Data-center NVIDIA: A100 (sm_80) and H100 (sm_90). Both are above
          # CUDA 13's sm_75 floor. Separate artifact rather than folding into
          # the consumer one above, same reasoning as CPU/Vulkan/CUDA already
          # being separate downloads: A100/H100 owners get a binary sized for
          # what they have, consumer-card owners don't pay for archs they
          # can't run. RTX A-series *workstation* cards are Ampere sm_86 and
          # already covered by the consumer build above — sm_80/90 is
          # specifically the compute-only A100/H100 line.
          - cuda: "13.1.2"
            artifact: eullm-linux-x64-cuda-13.1-datacenter
            cuda_tag: "13.1.2-devel-ubuntu22.04"
            cuda_archs: "80;90"

    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:${{ matrix.cuda_tag }}
    steps:
      # The nvidia/cuda image ships without git. actions/checkout then falls
      # back to a REST API tarball download, which cannot fetch submodules
      # ("Input 'submodules' not supported when falling back to download using
      # the GitHub REST API"). Installing git BEFORE checkout lets it do a real
      # clone and pull the llama.cpp submodule.
      - name: Install git (container has none; required for submodule checkout)
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git

      - uses: actions/checkout@v5
        with:
          # llama.cpp submodule under engine/vendor/llama-cpp-rs/llama-cpp-sys-2/
          submodules: recursive

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl cmake build-essential pkg-config libssl-dev git libclang-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Cache cargo registry (works inside containers)
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-cuda-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-cuda-

      # Cache Rust target/ directory.
      #
      # The `p1` generation marker is not decoration. Cargo decides the final
      # binary is fresh from *its* inputs (crates, build-script output), and
      # the CUDA static archives we link against are none of those — so a
      # restored target/ from before the nvprune step below would let cargo
      # skip the link entirely and publish the old fat binary from cache,
      # with a green build and no warning anywhere. The marker is in
      # restore-keys too, because a prefix match would restore the stale
      # cache just as effectively as an exact one. Bump it (`p2`, …) on any
      # future change to what gets linked but not to what cargo tracks.
      #
      # Keyed on `matrix.artifact`, not `matrix.cuda`: two matrix entries can
      # share the same CUDA version but build for different
      # CMAKE_CUDA_ARCHITECTURES (consumer vs. data-center) — cargo's
      # fingerprint doesn't see that env var either, so sharing this key
      # across them risks the exact same stale-cache problem the marker
      # above exists to prevent, just on a different axis.
      - uses: actions/cache@v5
        with:
          path: target
          key: target-cuda-p1-${{ matrix.artifact }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-cuda-p1-${{ matrix.artifact }}-

      # sccache now uses S3 backend (see workflow-level env block)

      - name: Install sccache
        run: |
          SCCACHE_VER=0.8.0
          TMPSC=$(mktemp -d)
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VER}/sccache-v${SCCACHE_VER}-x86_64-unknown-linux-musl.tar.gz" \
            -o "${TMPSC}/sccache.tar.gz"
          tar -xzf "${TMPSC}/sccache.tar.gz" -C "${TMPSC}"
          find "${TMPSC}" -maxdepth 2 -name sccache -type f -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/sccache
          rm -rf "${TMPSC}"
          # Only route compilers through sccache if the S3 backend is actually
          # reachable. A backend outage must degrade to a cache-less (slower)
          # build, never fail it. (v0.5.5 died at exit 101 when the endpoint
          # vanished mid-build; this is the belt to that suspenders.)
          if curl -sSf -m 10 "${SCCACHE_ENDPOINT}/minio/health/live" >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "CMAKE_CUDA_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "sccache: S3 backend reachable — caching enabled."
          else
            echo "::warning::sccache S3 backend (${SCCACHE_ENDPOINT}) unreachable — building WITHOUT cache (slower, but the build will not fail)."
          fi
          sccache --version
          sccache --start-server || true

      # The bulk of the published CUDA binary is neither our code nor ggml's
      # kernels — it is NVIDIA's static cuBLAS. The v0.7.2 assets say so
      # plainly: `eullm-linux-x64` is 16 MB and `eullm-linux-x64-vulkan`
      # (which carries a full set of GPU shaders) is 54 MB, while
      # `eullm-linux-x64-cuda-12.8` is 902 MB. That ~880 MB is
      # libcublas_static.a + libcublasLt_static.a, and those archives ship
      # device code for EVERY architecture the toolkit supports — Maxwell
      # (sm_50) through Blackwell. We compile ggml for exactly three
      # (CMAKE_CUDA_ARCHITECTURES below) and the binary cannot run on
      # anything else, so every other architecture's cuBLAS kernels are
      # weight the user downloads and never executes.
      #
      # nvprune is NVIDIA's own tool for this and ships with the toolkit —
      # its documented example is literally `nvprune -arch sm_120
      # libcublas_static.a`. Pruning the archives in place inside this
      # throwaway container needs no build.rs change: the link step just
      # picks up whatever lives in the toolkit's lib64.
      #
      # This is why a local build once came out ~210 MB smaller than the CI
      # build of the same commit: the local toolkit was CUDA 13, which had
      # already dropped the pre-Turing kernels. The job now uses CUDA 13 too,
      # so that part is settled at the source — but 13 still ships sm_75
      # through sm_121, which is nine architectures we cannot run on. The
      # prune is what removes those, and it is the larger of the two effects.
      #
      # Deliberately best-effort. A release that publishes a fat CUDA binary
      # is a nuisance; a release that publishes NO CUDA binary is a
      # regression, and the release job's `files:` glob would swallow the
      # omission silently. So a prune failure warns and leaves the originals
      # in place, and the byte counts go into the log either way.
      - name: Prune CUDA static libs to the architectures we ship
        run: |
          set -u
          NVPRUNE=/usr/local/cuda/bin/nvprune
          LIBDIR=/usr/local/cuda/lib64
          # -gencode is the form NVIDIA documents for keeping more than one
          # architecture; repeated -arch is documented as singular. Built
          # from matrix.cuda_archs (the same list the build step compiles
          # for) instead of a second hardcoded copy, so the two can't drift
          # apart on a future architecture change.
          KEEP=""
          IFS=';' read -ra ARCHS <<< "${{ matrix.cuda_archs }}"
          for a in "${ARCHS[@]}"; do
            KEEP="$KEEP -gencode=arch=compute_$a,code=sm_$a"
          done
          if [ ! -x "$NVPRUNE" ]; then
            echo "::warning::nvprune not found at $NVPRUNE — shipping unpruned CUDA libs"
            exit 0
          fi
          for lib in libcublas_static.a libcublasLt_static.a; do
            src="$LIBDIR/$lib"
            if [ ! -f "$src" ]; then
              echo "::warning::$src not found — skipped"
              continue
            fi
            before=$(stat -c%s "$src")
            if "$NVPRUNE" $KEEP "$src" -o "$src.pruned" && [ -s "$src.pruned" ]; then
              after=$(stat -c%s "$src.pruned")
              mv "$src.pruned" "$src"
              echo "$lib: $before -> $after bytes"
            else
              rm -f "$src.pruned"
              echo "::warning::nvprune failed on $lib — shipping it unpruned"
            fi
          done

      - name: Build engine with CUDA + multimodal (mtmd)
        run: |
          . "$HOME/.cargo/env"
          export PATH="/usr/local/cuda/bin:$PATH"
          cargo build --release --features "cuda,multimodal" -p eullm-engine
        env:
          CUDA_PATH: /usr/local/cuda
          CUDACXX: /usr/local/cuda/bin/nvcc
          CMAKE_CUDA_COMPILER: /usr/local/cuda/bin/nvcc
          # matrix.cuda_archs: "86;89;120" (consumer: RTX 3000/4000/5000) or
          # "80;90" (data-center: A100/H100) — see the matrix comment above.
          # cuBLAS static is the bulk of the binary and is shared across
          # archs, so adding more arches grows the file by ~kernel cubins
          # only (~50-80 MB each), not proportionally.
          CMAKE_CUDA_ARCHITECTURES: ${{ matrix.cuda_archs }}
          # NCCL is disabled at the CMake level in the vendored build.rs
          # (GGML_CUDA_NCCL=OFF). It is a multi-GPU collective library that made
          # the binary hard-depend on libnccl.so.2 at runtime — breaking
          # single-GPU consumer machines that only have the driver. With it off,
          # no nccl symbols are referenced, so no `-lnccl` link flag is needed
          # and the binary depends only on libcuda.so.1 (the driver).

      - name: sccache stats (visibility into S3 hit/miss)
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Package binary
        run: |
          cp target/release/eullm ${{ matrix.artifact }}
          strip --strip-all ${{ matrix.artifact }} || true
          chmod +x ${{ matrix.artifact }}
          # Printed so the effect of the nvprune step is visible in the log
          # without downloading the release asset to measure it.
          ls -l ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ARM64 + CUDA. Same recipe as build-cuda, on GitHub's free aarch64 runners
  # (ubuntu-24.04-arm) with the sbsa (aarch64) nvidia/cuda image — the tag is a
  # multi-arch manifest, so the arm64 variant is pulled automatically here.
  # Targets ARM hosts with a discrete NVIDIA GPU (Ampere Altra / Grace + RTX,
  # ARM dev kits, etc.). Compiling CUDA needs only nvcc, not a GPU on the runner.
  build-cuda-arm64:
    if: ${{ github.event_name == 'push' }}
    strategy:
      matrix:
        include:
          # See the x64 CUDA job for why this is 13.x and not 12.8.
          - cuda: "13.1.2"
            artifact: eullm-linux-arm64-cuda-13.1
            cuda_tag: "13.1.2-devel-ubuntu22.04"

    runs-on: ubuntu-24.04-arm
    container:
      image: nvidia/cuda:${{ matrix.cuda_tag }}
    steps:
      - name: Install git (container has none; required for submodule checkout)
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git

      - uses: actions/checkout@v5
        with:
          # llama.cpp submodule under engine/vendor/llama-cpp-rs/llama-cpp-sys-2/
          submodules: recursive

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl cmake build-essential pkg-config libssl-dev git libclang-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Cache cargo registry (arch-specific key so it never collides with x64)
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-cuda-arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-cuda-arm64-

      # Cache Rust target/ directory (arch-specific: arm64 objects differ from x64)
      - uses: actions/cache@v5
        with:
          path: target
          # `p1`: see the x64 CUDA job for why the generation marker exists.
          key: target-cuda-arm64-p1-${{ matrix.cuda }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-cuda-arm64-p1-${{ matrix.cuda }}-

      - name: Install sccache
        run: |
          SCCACHE_VER=0.8.0
          TMPSC=$(mktemp -d)
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VER}/sccache-v${SCCACHE_VER}-aarch64-unknown-linux-musl.tar.gz" \
            -o "${TMPSC}/sccache.tar.gz"
          tar -xzf "${TMPSC}/sccache.tar.gz" -C "${TMPSC}"
          find "${TMPSC}" -maxdepth 2 -name sccache -type f -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/sccache
          rm -rf "${TMPSC}"
          # Same S3 reachability probe as the x64 job: a backend outage degrades
          # to a cache-less build, never a failed one.
          if curl -sSf -m 10 "${SCCACHE_ENDPOINT}/minio/health/live" >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "CMAKE_CUDA_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "sccache: S3 backend reachable — caching enabled."
          else
            echo "::warning::sccache S3 backend (${SCCACHE_ENDPOINT}) unreachable — building WITHOUT cache (slower, but the build will not fail)."
          fi
          sccache --version
          sccache --start-server || true

      # Same reasoning as the x64 CUDA job — see the long comment there. The
      # arm64 CUDA asset is 863 MB for the same reason the x64 one is 902 MB.
      - name: Prune CUDA static libs to the architectures we ship
        run: |
          set -u
          NVPRUNE=/usr/local/cuda/bin/nvprune
          LIBDIR=/usr/local/cuda/lib64
          KEEP="-gencode=arch=compute_86,code=sm_86
                -gencode=arch=compute_89,code=sm_89
                -gencode=arch=compute_120,code=sm_120"
          if [ ! -x "$NVPRUNE" ]; then
            echo "::warning::nvprune not found at $NVPRUNE — shipping unpruned CUDA libs"
            exit 0
          fi
          for lib in libcublas_static.a libcublasLt_static.a; do
            src="$LIBDIR/$lib"
            if [ ! -f "$src" ]; then
              echo "::warning::$src not found — skipped"
              continue
            fi
            before=$(stat -c%s "$src")
            if "$NVPRUNE" $KEEP "$src" -o "$src.pruned" && [ -s "$src.pruned" ]; then
              after=$(stat -c%s "$src.pruned")
              mv "$src.pruned" "$src"
              echo "$lib: $before -> $after bytes"
            else
              rm -f "$src.pruned"
              echo "::warning::nvprune failed on $lib — shipping it unpruned"
            fi
          done

      - name: Build engine with CUDA + multimodal (mtmd)
        run: |
          . "$HOME/.cargo/env"
          export PATH="/usr/local/cuda/bin:$PATH"
          cargo build --release --features "cuda,multimodal" -p eullm-engine
        env:
          CUDA_PATH: /usr/local/cuda
          CUDACXX: /usr/local/cuda/bin/nvcc
          CMAKE_CUDA_COMPILER: /usr/local/cuda/bin/nvcc
          # Same consumer NVIDIA set as the x64 CUDA job:
          #   sm_86 = Ampere (RTX 3000, e.g. the RTX 3060 on ARM hosts)
          #   sm_89 = Ada Lovelace (RTX 4000)
          #   sm_120 = Blackwell (RTX 5000)
          CMAKE_CUDA_ARCHITECTURES: "86;89;120"
          # NCCL disabled at the CMake level (GGML_CUDA_NCCL=OFF in build.rs), so
          # no `-lnccl` and no libnccl.so.2 runtime dependency — critical here,
          # since an ARM host with only the driver (no NCCL, no sudo) otherwise
          # can't start the binary. See the x64 job for the full rationale.

      - name: sccache stats (visibility into S3 hit/miss)
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Package binary
        run: |
          cp target/release/eullm ${{ matrix.artifact }}
          strip --strip-all ${{ matrix.artifact }} || true
          chmod +x ${{ matrix.artifact }}
          # Printed so the effect of the nvprune step is visible in the log
          # without downloading the release asset to measure it.
          ls -l ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # CIX P1 (Armv9.2-A: SVE2, BF16, I8MM, DotProd) CPU-only profile — WP4
  # baseline for the Radxa Orion O6. Deliberately a SEPARATE artifact
  # from `build`'s generic eullm-linux-arm64: baking these ISA extensions
  # into the generic binary would SIGILL on any ARM64 host that doesn't
  # have them (Raspberry Pi, Graviton, other SoCs). Native ubuntu-24.04-arm
  # runner rather than cross-compiling from x86_64: its default gcc is
  # already GCC 13 (Ubuntu 22.04's gcc-aarch64-linux-gnu cross package is
  # 11.2.0, too old to parse -march=armv9.2-a at all), so no toolchain
  # upgrade step is needed here the way a cross-compile job would.
  # See docs/arm-cix-p1-cpu-profile.md for the full profile writeup.
  build-arm-cix-p1:
    strategy:
      matrix:
        include:
          - artifact: eullm-linux-arm64-cix-p1

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          # llama.cpp submodule under engine/vendor/llama-cpp-rs/llama-cpp-sys-2/
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-cix-p1

      - name: Install sccache
        shell: bash
        run: |
          SCCACHE_VER=0.8.0
          TMPSC=$(mktemp -d)
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VER}/sccache-v${SCCACHE_VER}-aarch64-unknown-linux-musl.tar.gz" \
            -o "${TMPSC}/sccache.tar.gz"
          tar -xzf "${TMPSC}/sccache.tar.gz" -C "${TMPSC}"
          find "${TMPSC}" -maxdepth 2 -name sccache -type f -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/sccache
          rm -rf "${TMPSC}"
          # Same S3 reachability probe as every other build job: a backend
          # outage degrades to a cache-less build, never a failed one.
          if curl -sSf -m 10 "${SCCACHE_ENDPOINT}/minio/health/live" >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "sccache: S3 backend reachable — caching enabled."
          else
            echo "::warning::sccache S3 backend (${SCCACHE_ENDPOINT}) unreachable — building WITHOUT cache (slower, but the build will not fail)."
          fi
          sccache --version
          sccache --start-server || true

      - name: Install build dependencies
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential pkg-config libssl-dev

      - name: Build engine (CIX P1 profile)
        run: cargo build --release --features multimodal -p eullm-engine
        env:
          # Read by engine/vendor/llama-cpp-rs/llama-cpp-sys-2/build.rs; falls
          # back to the generic armv8-a baseline everywhere this isn't set.
          LLAMA_GGML_CPU_ARM_ARCH: armv9.2-a+sve2+bf16+i8mm+dotprod

      - name: sccache stats (visibility into S3 hit/miss)
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Package binary
        run: |
          cp target/release/eullm ${{ matrix.artifact }}
          strip --strip-all ${{ matrix.artifact }} 2>/dev/null || strip -x ${{ matrix.artifact }} 2>/dev/null || true
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-windows:
    if: ${{ github.event_name == 'push' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          # llama.cpp submodule under engine/vendor/llama-cpp-rs/llama-cpp-sys-2/
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      # sccache now uses S3 backend (see workflow-level env block)

      - name: Install sccache
        shell: pwsh
        run: |
          $SCCACHE_VER = "0.8.0"
          $url = "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VER/sccache-v$SCCACHE_VER-x86_64-pc-windows-msvc.tar.gz"
          $tmp = New-Item -ItemType Directory -Path "$env:TEMP\sccache-install" -Force
          Invoke-WebRequest -Uri $url -OutFile "$tmp\sccache.tar.gz"
          tar -xzf "$tmp\sccache.tar.gz" -C "$tmp"
          $exe = Get-ChildItem -Path $tmp -Recurse -Filter sccache.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "C:\Windows\System32\sccache.exe"
          sccache --version
          # Only route compilers through sccache if the S3 backend is actually
          # reachable. A backend outage must degrade to a cache-less (slower)
          # build, never fail it (cf. v0.5.5: endpoint gone mid-build → exit 101).
          $reachable = $false
          try {
              Invoke-WebRequest -Uri "${env:SCCACHE_ENDPOINT}/minio/health/live" -UseBasicParsing -TimeoutSec 10 | Out-Null
              $reachable = $true
          } catch { $reachable = $false }
          if ($reachable) {
              "RUSTC_WRAPPER=sccache" | Add-Content -Path $env:GITHUB_ENV
              "CMAKE_C_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
              "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
              "CMAKE_CUDA_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
              sccache --start-server
              Write-Host "sccache: S3 backend reachable — caching enabled."
          } else {
              Write-Host "::warning::sccache S3 backend (${env:SCCACHE_ENDPOINT}) unreachable — building WITHOUT cache (slower, but the build will not fail)."
          }

      - name: Build engine
        env:
          # Same x86-64-v3 baseline as eullm-linux-x64/eullm-macos-x64 — see
          # docs/x86-64-baseline.md.
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: cargo build --release --target x86_64-pc-windows-msvc --features multimodal -p eullm-engine

      - name: sccache stats (visibility into S3 hit/miss)
        if: always()
        shell: pwsh
        # `if: always()` means this also runs after an earlier step failed, and
        # if that step was the toolchain install then sccache was never put on
        # PATH — so this one dies too, and its red "sccache is not recognized"
        # sits at the bottom of the log where the real cause is easy to miss.
        # It cost a diagnosis on v0.7.3. The Linux jobs already tolerate this
        # with `|| true`; this is the same thing in PowerShell.
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats
          } else {
            Write-Host "sccache not on PATH (an earlier step failed) — no stats to show"
          }

      - name: Package binary
        shell: pwsh
        run: |
          Copy-Item "target\x86_64-pc-windows-msvc\release\eullm.exe" -Destination "eullm-windows-x64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eullm-windows-x64
          path: eullm-windows-x64.exe

  build-windows-cuda:
    if: ${{ github.event_name == 'push' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          # llama.cpp submodule under engine/vendor/llama-cpp-rs/llama-cpp-sys-2/
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17.0"

      # Ninja is the key to caching C++/CUDA on Windows: the default CMake
      # "Visual Studio" generator (MSBuild) silently ignores
      # CMAKE_*_COMPILER_LAUNCHER, so cl.exe and nvcc bypass sccache entirely.
      # Ninja honours those vars, which lets sccache content-hash every C++/CUDA
      # compile and route it to/from S3 just like on Linux. Proven in the
      # try-windows-ninja experiment (run #2): 205 C/C++ + 130 CUDA compiles
      # were tracked and written to S3, vs 0 with the VS generator.
      - name: Install Ninja
        run: choco install ninja --no-progress --yes
        shell: pwsh

      - name: Install CUDA toolkit 13.1
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          # 13.1.1, not the 13.1.2 the Linux containers use, because this
          # action carries its own hardcoded table of download URLs and the
          # pinned tag's table stops at 13.1.1 — v0.7.3 failed here in one
          # second with "Version not available: 13.1.2". The version list on
          # the action's master branch is NOT the list the pinned tag has;
          # check the tag (src/links/windows-links.ts at v0.2.35) before
          # changing this. Both sides are still CUDA 13.1, which is what the
          # artifact name and the driver requirement are about, so the patch
          # difference is deliberate and not a mismatch to "fix". Raising it
          # further means bumping the action tag first.
          cuda: "13.1.1"
          # `local` (full offline installer ~3 GB) instead of `network`: the
          # network installer is a tiny bootstrapper that re-downloads ~5 GB
          # of packages from NVIDIA's CDN on EVERY run (6-17 min, variable),
          # because use-github-cache only caches the bootstrapper, not the
          # toolkit. The local installer is fully cached by GitHub Actions
          # cache (use-github-cache: true, default), so subsequent runs
          # restore it locally and install offline — no NVIDIA CDN, ~2-4 min.
          # sccache stays on S3 and is untouched; only this ~3 GB installer
          # shares the 10 GB GitHub cache with the Swatinem rust-cache.
          method: local
          # Install ~700 MB of components instead of the full ~3 GB toolkit.
          # This step was the single most expensive thing in the whole release:
          # 7m34s on v0.6.38, of which 22s was fetching the (already cached)
          # installer and 7m12s was the installer itself running. Caching
          # cannot touch that 7m12s — the only lever is installing less.
          #
          # An earlier attempt at this was reverted with the note that Windows
          # needs "cudart_12.8" where Linux uses "cudart". That diagnosis was
          # wrong, which is why the idea stayed buried: this action appends the
          # version itself — src/installer.ts does
          #   `${subPackage}_${version.major}.${version.minor}`
          # — so "cudart" here becomes "cudart_12.8" on the command line, which
          # is exactly the form NVIDIA documents for the Windows silent
          # installer. What actually differs between platforms is the BASE
          # names: Linux network packages are "cuda-nvcc" / "libcublas-dev",
          # Windows components are "nvcc" / "cublas_dev". The names below are
          # the Windows ones, from NVIDIA's installation guide. (The README's
          # "only works with the network method" caveat is Linux-only; our
          # Linux CUDA jobs use a devel container and never run this action.)
          #
          # The list is derived from what the code actually includes, not from
          # guesswork: ggml-cuda includes cuda.h, cuda_runtime.h,
          # cuda_fp16/bf16/fp4/fp8.h, cooperative_groups.h, mma.h (cudart),
          # cub/cub.cuh (thrust), cublas_v2.h (cublas_dev), and CMake links
          # CUDA::cudart / CUDA::cublas / CUDA::cuda_driver. No nvml, nvrtc,
          # nvtx or cupti anywhere in the backend. The packaging step below
          # ships exactly three DLLs — cudart64, cublas64, cublasLt64 — all of
          # which come from cudart + cublas, so nothing shipped changes.
          #
          # Skipped, and never referenced by anything we build: Nsight Systems
          # (368 MB), Nsight Compute (328 MB), nvrtc (291 MB), cuSPARSE
          # (272 MB), nvJitLink (245 MB), cuSOLVER (235 MB), NPP (196 MB),
          # cuFFT (182 MB), nvvp (115 MB), cuRAND, CUPTI, sanitizer, docs,
          # OpenCL, demo suite — 2.3 GB in total, per NVIDIA's own
          # redistrib_12.8.0.json manifest.
          #
          # Failure mode if a component is missing: the build stops at compile
          # or link time with a missing header or unresolved symbol. Loud and
          # immediate — it cannot produce a subtly wrong binary. Validate a
          # change to this list by dispatching try-windows-ninja.yml, which
          # carries the same list, rather than by spending a release.
          #
          # SUSPENDED ON THE MOVE TO CUDA 13 — the list above is the 12.8 one
          # and is kept for the day it can be restored. Every component name in
          # it still exists in 13.1 (checked against NVIDIA's 13.1 Windows
          # installation guide, including that "thrust" was NOT folded into
          # cccl), and the install itself succeeded. The build then died in
          # CMake's CUDA compiler-detection step:
          #
          #   CUDA/v13.1/include\cuda_runtime.h(82): fatal error C1083:
          #   Cannot open include file: 'crt/host_config.h'
          #
          # So in CUDA 13 the include/crt/ headers come from some component
          # this list does not name, and which one is not documented anywhere
          # findable: NVIDIA's own forum thread reporting exactly this on
          # GitHub runners ("CUDA 13.0 on GitHub action runners:
          # 'crt/host_config.h': No such file or directory") sat unanswered.
          # Two release builds were already spent guessing at CUDA 13 details;
          # a third guess is not worth ~7 minutes of installer time. Installing
          # everything is deterministic — a full toolkit always has that
          # header.
          #
          # To restore the trim: dispatch try-windows-ninja.yml with the list
          # re-added plus one candidate component at a time, and put the winner
          # back here. That workflow exists for exactly this, and using it
          # instead of a release is the lesson from tonight.

      # Say "the toolkit is incomplete" in those words, at the moment it is
      # knowable. The CUDA 13 failure this replaces surfaced as CMake being
      # unable to identify the CUDA compiler — several layers away from the
      # one missing file, inside a cargo build script, and it cost a release
      # build to read. These are the headers ggml-cuda's include chain reaches
      # first, so if any is absent nothing downstream can work.
      - name: Verify the CUDA toolkit has the headers the build needs
        shell: pwsh
        env:
          CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
        run: |
          $inc = Join-Path $env:CUDA_PATH "include"
          $want = @("crt\host_config.h", "cuda_runtime.h", "cuda_fp16.h", "cublas_v2.h")
          $missing = $want | Where-Object { -not (Test-Path (Join-Path $inc $_)) }
          if ($missing) {
            Write-Host "::error::CUDA toolkit at $env:CUDA_PATH is missing: $($missing -join ', ')"
            Write-Host "The installed component set does not cover these headers — see the sub-packages note on the install step."
            exit 1
          }
          Write-Host "CUDA headers present under $inc"

      # MSVC env (vcvarsall) must be ACTIVE for Ninja to find cl.exe / nvcc.
      # Plain `runs-on: windows-2022` does NOT activate it — that's only set up
      # for MSBuild. We invoke vcvars64.bat directly (via vswhere to find the
      # VS install dir) and diff the resulting environment into $GITHUB_ENV so
      # every later step (cargo build → cmake → Ninja → cl.exe / nvcc) sees it.
      - name: Activate MSVC x64 dev environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -property installationPath
          if (-not $installPath) { throw "vswhere did not find a Visual Studio install" }
          $vcvars = "$installPath\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          Write-Host "Activating: $vcvars"
          $envBefore = @{}
          foreach ($e in (Get-ChildItem env:)) { $envBefore[$e.Name] = $e.Value }
          $output = cmd /c "`"$vcvars`" >NUL 2>&1 && set"
          foreach ($line in $output) {
              if ($line -match "^([^=]+)=(.*)$") {
                  $name = $matches[1]
                  $value = $matches[2]
                  if ($envBefore[$name] -ne $value) {
                      "$name=$value" | Add-Content -Path $env:GITHUB_ENV
                  }
              }
          }
          Write-Host "MSVC env activated."

      # continue-on-error: a transient failure of the GitHub Actions cache
      # service during restore must not nuke this ~50 min long-pole job. On
      # beta.7 the cache restore here errored and killed the whole build before
      # a single object compiled. A cache miss/blip should degrade to a slower,
      # cache-less build (sccache/S3 still carries the C++/CUDA objects anyway),
      # never a hard failure.
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: x86_64-pc-windows-msvc-cuda-13.1

      # sccache now uses S3 backend (see workflow-level env block)

      - name: Install sccache
        shell: pwsh
        run: |
          $SCCACHE_VER = "0.8.0"
          $url = "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VER/sccache-v$SCCACHE_VER-x86_64-pc-windows-msvc.tar.gz"
          $tmp = New-Item -ItemType Directory -Path "$env:TEMP\sccache-install" -Force
          Invoke-WebRequest -Uri $url -OutFile "$tmp\sccache.tar.gz"
          tar -xzf "$tmp\sccache.tar.gz" -C "$tmp"
          $exe = Get-ChildItem -Path $tmp -Recurse -Filter sccache.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "C:\Windows\System32\sccache.exe"
          sccache --version
          # Only route compilers through sccache if the S3 backend is actually
          # reachable. A backend outage must degrade to a cache-less (slower)
          # build, never fail it (cf. v0.5.5: endpoint gone mid-build → exit 101).
          $reachable = $false
          try {
              Invoke-WebRequest -Uri "${env:SCCACHE_ENDPOINT}/minio/health/live" -UseBasicParsing -TimeoutSec 10 | Out-Null
              $reachable = $true
          } catch { $reachable = $false }
          if ($reachable) {
              "RUSTC_WRAPPER=sccache" | Add-Content -Path $env:GITHUB_ENV
              "CMAKE_C_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
              "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
              "CMAKE_CUDA_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
              sccache --start-server
              Write-Host "sccache: S3 backend reachable — caching enabled."
          } else {
              Write-Host "::warning::sccache S3 backend (${env:SCCACHE_ENDPOINT}) unreachable — building WITHOUT cache (slower, but the build will not fail)."
          }

      - name: Build engine with CUDA + multimodal (mtmd)
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc --features "cuda,multimodal" -p eullm-engine
        env:
          CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
          # Ampere (RTX 3000) + Ada (RTX 4000) + Blackwell (RTX 5000).
          CMAKE_CUDA_ARCHITECTURES: "86;89;120"
          # Force the Ninja generator (instead of the default VS/MSBuild one)
          # so sccache actually sees cl.exe + nvcc invocations and can cache
          # them — see "Install Ninja" step above for the full rationale.
          CMAKE_GENERATOR: Ninja

      - name: sccache stats (visibility into S3 hit/miss)
        if: always()
        shell: pwsh
        # `if: always()` means this also runs after an earlier step failed, and
        # if that step was the toolchain install then sccache was never put on
        # PATH — so this one dies too, and its red "sccache is not recognized"
        # sits at the bottom of the log where the real cause is easy to miss.
        # It cost a diagnosis on v0.7.3. The Linux jobs already tolerate this
        # with `|| true`; this is the same thing in PowerShell.
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats
          } else {
            Write-Host "sccache not on PATH (an earlier step failed) — no stats to show"
          }

      - name: Package binary + bundle CUDA runtime DLLs
        shell: pwsh
        run: |
          # Windows links CUDA dynamically (NVIDIA ships DLLs, not static
          # libs), so eullm.exe needs the CUDA runtime DLLs next to it to
          # launch. We ship a ZIP containing the exe + the three DLLs that
          # llama.cpp inference actually loads. The user extracts and runs
          # eullm.exe from the same folder — no CUDA Toolkit install needed.
          $bundle = "eullm-windows-x64-cuda-13.1"
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\eullm.exe" -Destination "$bundle\eullm.exe"

          # Search the whole toolkit tree for the three DLLs, rather than
          # assuming they sit directly under \bin. That assumption held for
          # CUDA 12.8 and broke on the move to 13.1: `$env:CUDA_PATH\bin`
          # matched nothing, all three Copy-Item calls silently copied
          # zero files (a glob with no match is not an error in
          # PowerShell), and the bundle shipped as exe-only — caught only
          # by the dumpbin check below, which is exactly what it exists
          # for. NVIDIA does not document the post-install layout, and it
          # has already moved once; searching finds the files wherever
          # this toolkit version put them, instead of encoding a path that
          # the next version can silently invalidate the same way.
          $names = "cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll"
          foreach ($pattern in $names) {
            $hit = Get-ChildItem -Path $env:CUDA_PATH -Recurse -Filter $pattern -File -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if ($hit) {
              Copy-Item $hit.FullName -Destination $bundle
              Write-Host "Bundled $($hit.Name) from $($hit.DirectoryName)"
            } else {
              Write-Host "::warning::no file matching $pattern found anywhere under $env:CUDA_PATH"
            }
          }
          Get-ChildItem $bundle | Format-Table Name, Length

          # Prove the bundle is self-contained instead of assuming it.
          #
          # Which NVIDIA DLLs cuBLAS itself pulls in is a property of the
          # toolkit, not of our code, and it changes between major versions —
          # cuBLASLt has grown dependencies (nvJitLink) in the 12.x line
          # already. Getting this wrong is uniquely nasty: Windows resolves
          # imports at process start, so the user gets a dialog box, no log
          # line, and an exe that never runs. Nothing in CI would notice.
          #
          # dumpbin is on PATH because the MSVC dev environment is active for
          # Ninja. Read only the "Image has the following dependencies"
          # section — delay-loaded imports are listed separately and are not
          # required at start-up. Any cu*/nv* import that is not in the folder
          # and not a system DLL fails the step: a bundle that cannot launch
          # is worse than one that is missing, and the fix is one more
          # Copy-Item once the log names the file.
          # Only a genuinely missing DLL fails this step. If the check itself
          # throws — dumpbin absent, output format changed — it warns and gets
          # out of the way, because losing the Windows CUDA artifact to a bug
          # in a safety net is a worse outcome than the net not running.
          $needed = $null
          try {
            $found = @()
            foreach ($f in Get-ChildItem $bundle -File | Where-Object { $_.Extension -in '.exe', '.dll' }) {
              $out = & dumpbin /dependents $f.FullName 2>&1 | Out-String
              $head = ($out -split 'Image has the following delay load dependencies')[0]
              $found += [regex]::Matches($head, '(?im)^\s+((?:cu|nv)\w*\.dll)\s*$') |
                        ForEach-Object { $_.Groups[1].Value }
            }
            $needed = $found | Sort-Object -Unique
          } catch {
            Write-Host "::warning::dependency check could not run ($_) — bundle NOT verified"
          }
          if ($null -ne $needed) {
            $have = (Get-ChildItem $bundle -Filter *.dll).Name
            $missing = $needed | Where-Object { $have -notcontains $_ }
            if ($missing) {
              Write-Host "::error::NVIDIA DLLs imported but not bundled: $($missing -join ', ')"
              Write-Host "Add a Copy-Item for each, and its sub-package to the CUDA install step above."
              exit 1
            }
            Write-Host "Bundle is self-contained. NVIDIA imports: $($needed -join ', ')"
          }

          Compress-Archive -Path "$bundle\*" -DestinationPath "$bundle.zip" -Force
        env:
          CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eullm-windows-x64-cuda-13.1
          path: eullm-windows-x64-cuda-13.1.zip

  release:
    needs:
      - require_green_ci
      - require_version_match
      - build
      - build-vulkan
      - build-cuda
      - build-cuda-arm64
      - build-arm-cix-p1
      - build-windows
      - build-windows-cuda
    # Run as long as at least one upstream job built something. We never
    # want a single failing build to nuke a release after CI on the others.
    # Also never run on a manual workflow_dispatch (that's only for testing
    # build-arm-cix-p1 in isolation, and there's no real tag to attach a
    # release to on that trigger).
    #
    # `require_green_ci` is the one upstream job that is NOT covered by that
    # graceful degradation: `!cancelled()` deliberately lets this job run even
    # when needs failed or were skipped, so without naming its result
    # explicitly a failed gate would skip the builds and then publish a release
    # with nothing but the source archives attached.
    if: >-
      ${{ !cancelled()
          && github.event_name == 'push'
          && needs.require_green_ci.result == 'success'
          && needs.require_version_match.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            for file in "$dir"*; do
              sha256sum "$file" >> checksums.txt
            done
          done
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Mark the GitHub Release as a pre-release when the tag carries a
          # pre-release suffix (-beta, -rc, -alpha). Stable tags like
          # EuLLM-v0.5.18 remain marked as "Latest release"; experimental
          # tags like EuLLM-v0.5.18-beta.1 surface in the Releases list but
          # never replace the Latest pointer downstream installers follow.
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          # Skip files that did not get produced (e.g. one build job failed)
          # so the release still publishes the binaries that built. The matrix
          # also tolerates entire upstream jobs being missing thanks to the
          # `if: !cancelled()` guard above.
          fail_on_unmatched_files: false
          # A glob, not a hand-written list. The list was maintained by hand
          # and v0.6.47 published nine binaries out of ten: `build-vulkan`
          # succeeded, its artifact was downloaded, its checksum went into
          # checksums.txt, and the file was never attached because nobody had
          # added a line for it. `fail_on_unmatched_files: false` meant the
          # omission was silent by construction. Every build job uploads its
          # artifact into a directory of its own name holding exactly one
          # file, so the glob is exactly the set that was built, and a new
          # build job is published without anyone remembering to.
          files: |
            artifacts/*/*
            artifacts/checksums.txt
          body: |
            ## EULLM Engine ${{ github.ref_name }}

            Drop-in Ollama replacement with continuous batching and EU AI Act audit trail.

            ### Quick install

            ```bash
            # Linux x64 (CPU only)
            curl -L https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-linux-x64 -o eullm
            chmod +x eullm

            # Linux x64 with NVIDIA GPU (CUDA 13.1 — supports RTX 3000/4000/5000 series)
            curl -L https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-linux-x64-cuda-13.1 -o eullm
            chmod +x eullm

            # macOS Apple Silicon
            curl -L https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-macos-arm64 -o eullm
            chmod +x eullm
            ```

            ```powershell
            # Windows x64 (CPU only) — PowerShell
            Invoke-WebRequest -Uri https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-windows-x64.exe -OutFile eullm.exe

            # Windows x64 with NVIDIA GPU (CUDA 13.1 — supports RTX 3000/4000/5000)
            # This is a ZIP: eullm.exe + the CUDA runtime DLLs it needs.
            Invoke-WebRequest -Uri https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-windows-x64-cuda-13.1.zip -OutFile eullm-cuda.zip
            Expand-Archive eullm-cuda.zip -DestinationPath eullm-cuda
            # Run eullm.exe from inside the extracted folder (the DLLs must
            # stay next to it).
            .\eullm-cuda\eullm.exe run model.gguf
            ```

            ### Which binary to download?

            | Binary | GPU Support | Requirements |
            |--------|-------------|--------------|
            | `eullm-linux-x64` | CPU only | None |
            | `eullm-linux-x64-vulkan` | Any GPU with a Vulkan driver (AMD, Intel, NVIDIA) | `libvulkan.so.1` and a working driver on the machine — mesa RADV, amdvlk, NVIDIA or Intel ANV. Nothing is bundled |
            | `eullm-linux-x64-cuda-13.1` | NVIDIA GPU (RTX 3000/4000/5000) | NVIDIA driver 580+ |
            | `eullm-linux-arm64` | CPU only | ARM64 Linux |
            | `eullm-macos-x64` | CPU only | macOS Intel |
            | `eullm-macos-arm64` | Metal (Apple GPU) | macOS Apple Silicon |
            | `eullm-windows-x64.exe` | CPU only | Windows 10/11 x64 |
            | `eullm-windows-x64-cuda-13.1.zip` | NVIDIA GPU (RTX 3000/4000/5000) | NVIDIA driver 580+ for Windows. ZIP bundles eullm.exe + CUDA DLLs — run from the extracted folder |

            ### Pick a model interactively

            ```bash
            # Run with no arguments to open the model picker (local models + catalog)
            ./eullm
            ```

            ### Web browsing

            ```bash
            # Enable transparent web fetch (URLs in messages are fetched and injected)
            ./eullm run model.gguf --web
            ```

            ### Usage

            ```bash
            ./eullm run ./model.gguf                    # Run any GGUF model
            ./eullm run ./model.gguf --batch-size 16    # Continuous batching for RAG
            ./eullm run ./model.gguf --web              # Enable web browsing
            ```

            ### Verify checksums

            ```bash
            sha256sum -c checksums.txt
            ```

  # ── Housekeeping: drop the caches this tag created ──────────────────────
  #
  # Every release leaves behind ~4.5 GB of Actions cache that NOTHING will ever
  # read again. Caches are ref-scoped: a run can restore entries saved on its
  # own ref or on the default branch, and tag→tag is blocked outright (cache
  # poisoning protection). So `target-cuda-*`, `cargo-registry-*` and the
  # `v0-rust-*` entries saved under refs/tags/EuLLM-vX.Y.Z are dead the moment
  # that release finishes: v0.6.40 cannot see v0.6.39's, and neither can CI on
  # main. Measured after v0.6.39: 4.6 GB of 8.91 GB used were exactly this.
  #
  # It is not merely untidy. Eviction is LRU against a 10 GB per-repo cap, and
  # these corpses were touched more recently than the small, live main-scoped
  # caches — so as the repo approaches the cap, GitHub can evict something
  # useful while keeping something unreadable.
  #
  # WHY IT ONLY RUNS ON A FULLY GREEN RELEASE: deleting a tag and re-pushing it
  # is the documented way to retry a release, and a retry runs on the SAME ref,
  # so it *can* read these caches. Pruning after a partial run would make every
  # retry cold — the opposite of the point. A job with `needs:` and an `if:`
  # that calls no status function keeps the implicit `success()`, so this runs
  # only when every build and the release itself succeeded. Nothing to retry,
  # nothing worth keeping.
  #
  # Deletes strictly by ref, and re-checks each entry's ref before removing it
  # rather than trusting the query filter. Main-scoped caches (the engine and
  # hub CI entries, pip-forge, the ninja experiment) are never candidates.
  prune_tag_caches:
    name: Drop this tag's Actions caches
    needs:
      - build
      - build-cuda
      - build-cuda-arm64
      - build-arm-cix-p1
      - build-windows
      - build-windows-cuda
      - release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Delete caches scoped to this tag
        # Housekeeping must never turn a published release red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          echo "Pruning Actions caches scoped to $REF"

          entries=$(gh api --paginate \
            "repos/$REPO/actions/caches?ref=$REF&per_page=100" \
            --jq '.actions_caches[] | [.id, .ref, .size_in_bytes, .key] | @tsv')

          if [ -z "$entries" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          total=0
          count=0
          while IFS=$'\t' read -r id ref size key; do
            [ -n "$id" ] || continue
            # Belt and braces: the query already filters by ref, but this is a
            # destructive call on shared infrastructure, so verify rather than
            # trust. Anything not saved under this exact tag is left alone.
            if [ "$ref" != "$REF" ]; then
              echo "::warning::skipping $key — ref is $ref, not $REF"
              continue
            fi
            printf 'deleting %10s bytes  %s\n' "$size" "$key"
            gh api -X DELETE "repos/$REPO/actions/caches/$id" --silent
            total=$(( total + size ))
            count=$(( count + 1 ))
          done <<< "$entries"

          echo "Deleted $count cache entr(ies), freeing $(( total / 1024 / 1024 )) MiB."
