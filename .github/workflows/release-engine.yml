name: Release Engine

on:
  push:
    tags:
      - "engine-v*"
      - "EuLLM-v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Force any JS-based action still pinned to Node 20 to run on Node 24.
  # Documented escape hatch from GitHub's Node 20 deprecation notice
  # (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/).
  # Needed today because KyleMayes/install-llvm-action has not yet shipped
  # a v3 with a Node 24 runtime — without this flag the workflow emits a
  # deprecation warning on every run and would break on June 16, 2026 when
  # Node 20 is forced off.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: eullm-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: eullm-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-15
            artifact: eullm-macos-x64
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: eullm-macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # sccache persisted via actions/cache — disk-only, no GHA cache API dependency
      - uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: sccache-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: sccache-${{ matrix.target }}-

      - name: Install sccache
        shell: bash
        run: |
          SCCACHE_VER=0.8.0
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          if [ "$OS" = "linux" ]; then
            TRIPLE="x86_64-unknown-linux-musl"
          elif [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ]; then
            TRIPLE="aarch64-apple-darwin"
          else
            TRIPLE="x86_64-apple-darwin"
          fi
          # Use mktemp+find to avoid --wildcards which doesn't exist on BSD tar (macOS)
          TMPSC=$(mktemp -d)
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VER}/sccache-v${SCCACHE_VER}-${TRIPLE}.tar.gz" \
            -o "${TMPSC}/sccache.tar.gz"
          tar -xzf "${TMPSC}/sccache.tar.gz" -C "${TMPSC}"
          find "${TMPSC}" -maxdepth 2 -name sccache -type f -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/sccache
          rm -rf "${TMPSC}"
          mkdir -p ~/.cache/sccache
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          sccache --version

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential pkg-config libssl-dev

      - name: Build engine
        run: cargo build --release --target ${{ matrix.target }} -p eullm-engine

      - name: Package binary
        run: |
          cp target/${{ matrix.target }}/release/eullm ${{ matrix.artifact }}
          strip --strip-all ${{ matrix.artifact }} 2>/dev/null || strip -x ${{ matrix.artifact }} 2>/dev/null || true
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-cuda:
    strategy:
      matrix:
        include:
          - cuda: "12.8.1"
            artifact: eullm-linux-x64-cuda-12.8
            cuda_tag: "12.8.1-devel-ubuntu22.04"

    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:${{ matrix.cuda_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl cmake build-essential pkg-config libssl-dev git libclang-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Cache cargo registry (works inside containers)
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-cuda-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-cuda-

      # Cache Rust target/ directory
      - uses: actions/cache@v5
        with:
          path: target
          key: target-cuda-${{ matrix.cuda }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-cuda-${{ matrix.cuda }}-

      # sccache: disk cache persisted via actions/cache — no GHA cache API dependency at runtime
      - uses: actions/cache@v5
        with:
          path: /tmp/sccache-store
          key: sccache-cuda-${{ matrix.cuda }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: sccache-cuda-${{ matrix.cuda }}-

      - name: Install sccache
        run: |
          SCCACHE_VER=0.8.0
          TMPSC=$(mktemp -d)
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VER}/sccache-v${SCCACHE_VER}-x86_64-unknown-linux-musl.tar.gz" \
            -o "${TMPSC}/sccache.tar.gz"
          tar -xzf "${TMPSC}/sccache.tar.gz" -C "${TMPSC}"
          find "${TMPSC}" -maxdepth 2 -name sccache -type f -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/sccache
          rm -rf "${TMPSC}"
          mkdir -p /tmp/sccache-store
          echo "SCCACHE_DIR=/tmp/sccache-store" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          sccache --version

      - name: Build engine with CUDA
        run: |
          . "$HOME/.cargo/env"
          export PATH="/usr/local/cuda/bin:$PATH"
          cargo build --release --features cuda -p eullm-engine
        env:
          CUDA_PATH: /usr/local/cuda
          CUDACXX: /usr/local/cuda/bin/nvcc
          CMAKE_CUDA_COMPILER: /usr/local/cuda/bin/nvcc
          # Fat binary covering the three consumer NVIDIA generations:
          #   sm_86  = Ampere      (RTX 3000 series)
          #   sm_89  = Ada Lovelace (RTX 4000 series)
          #   sm_120 = Blackwell    (RTX 5000 series)
          # cuBLAS static is the bulk of the binary and is shared across
          # archs, so adding two more arches grows the file by ~kernel
          # cubins only (~50-80 MB each), not 3x.
          CMAKE_CUDA_ARCHITECTURES: "86;89;120"

      - name: Package binary
        run: |
          cp target/release/eullm ${{ matrix.artifact }}
          strip --strip-all ${{ matrix.artifact }} || true
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-cuda-turboquant:
    strategy:
      matrix:
        include:
          - cuda: "12.8.1"
            artifact: eullm-linux-x64-cuda12.8-turboquant-exp
            cuda_tag: "12.8.1-devel-ubuntu22.04"

    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:${{ matrix.cuda_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl cmake build-essential pkg-config libssl-dev git libclang-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Cache cargo registry
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-cuda-tq-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-cuda-tq-

      # Cache vendored TurboQuant llama.cpp clone
      # Key: hash of setup script (encodes the pinned version tag)
      - uses: actions/cache@v5
        id: vendor-cache
        with:
          path: engine/vendor
          key: tq-vendor-linux-${{ hashFiles('engine/scripts/setup-turboquant.sh') }}

      # Cache Rust target/ directory — avoids full relink on every run.
      # Keyed on Cargo.lock + setup script so it invalidates on dep upgrades
      # or TurboQuant version bumps.  restore-keys fall back to any previous
      # CUDA-TQ target/ cache so incremental builds stay fast across patches.
      - uses: actions/cache@v5
        with:
          path: target
          key: target-cuda-tq-${{ matrix.cuda }}-${{ hashFiles('Cargo.lock', 'engine/scripts/setup-turboquant.sh') }}
          restore-keys: |
            target-cuda-tq-${{ matrix.cuda }}-
            target-cuda-tq-

      # sccache: disk cache persisted via actions/cache — no GHA cache API dependency at runtime
      - uses: actions/cache@v5
        with:
          path: /tmp/sccache-store
          key: sccache-cuda-tq-${{ matrix.cuda }}-${{ hashFiles('Cargo.lock', 'engine/scripts/setup-turboquant.sh') }}
          restore-keys: |
            sccache-cuda-tq-${{ matrix.cuda }}-
            sccache-cuda-tq-

      - name: Install sccache
        run: |
          SCCACHE_VER=0.8.0
          TMPSC=$(mktemp -d)
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VER}/sccache-v${SCCACHE_VER}-x86_64-unknown-linux-musl.tar.gz" \
            -o "${TMPSC}/sccache.tar.gz"
          tar -xzf "${TMPSC}/sccache.tar.gz" -C "${TMPSC}"
          find "${TMPSC}" -maxdepth 2 -name sccache -type f -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/sccache
          rm -rf "${TMPSC}"
          mkdir -p /tmp/sccache-store
          echo "SCCACHE_DIR=/tmp/sccache-store" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          sccache --version

      - name: Setup TurboQuant backend
        working-directory: engine
        run: |
          . "$HOME/.cargo/env"
          cargo fetch
          if [ "${{ steps.vendor-cache.outputs.cache-hit }}" != "true" ]; then
            bash scripts/setup-turboquant.sh
          else
            echo "Vendor cache hit — skipping TurboQuant clone."
            # Still need to activate the Cargo patch if not present
            if ! grep -q '^\[patch.crates-io\]' ../Cargo.toml; then
              bash scripts/setup-turboquant.sh
            fi
          fi
          echo "--- Verifying patch (workspace root) ---"
          grep -A2 'patch.crates-io' ../Cargo.toml || echo "NO PATCH FOUND"
          . "$HOME/.cargo/env" && cargo tree -i llama-cpp-sys-2 2>&1 | head -5

      - name: Create NCCL stub (TurboQuant v1.5.3 multi-GPU support)
        run: |
          # TurboQuant v1.5.3 added multi-GPU AllReduce via NCCL.
          # NCCL is not installed in this container and not needed for single-GPU inference.
          # Provide no-op stubs so the linker is satisfied; these are never called at runtime.
          mkdir -p /tmp/nccl-stub
          cat > /tmp/nccl-stub/nccl_stub.c << 'STUB_EOF'
          #include <stddef.h>
          typedef int ncclResult_t;
          typedef void* ncclComm_t;
          typedef int ncclDataType_t;
          typedef int ncclRedOp_t;
          typedef void* cudaStream_t;
          ncclResult_t ncclCommInitAll(ncclComm_t* c, int n, const int* d) { (void)c;(void)n;(void)d; return 0; }
          const char* ncclGetErrorString(ncclResult_t r) { (void)r; return "nccl-stub"; }
          ncclResult_t ncclGroupStart(void) { return 0; }
          ncclResult_t ncclAllReduce(const void* s, void* r, size_t n, ncclDataType_t t, ncclRedOp_t op, ncclComm_t c, cudaStream_t st) { (void)s;(void)r;(void)n;(void)t;(void)op;(void)c;(void)st; return 0; }
          ncclResult_t ncclGroupEnd(void) { return 0; }
          STUB_EOF
          gcc -c /tmp/nccl-stub/nccl_stub.c -o /tmp/nccl-stub/nccl_stub.o
          echo "RUSTFLAGS=-C link-arg=/tmp/nccl-stub/nccl_stub.o" >> $GITHUB_ENV

      - name: Build engine with CUDA + TurboQuant
        run: |
          . "$HOME/.cargo/env"
          export PATH="/usr/local/cuda/bin:$PATH"
          cargo build --release --features "cuda turboquant_native" -p eullm-engine
        env:
          CUDA_PATH: /usr/local/cuda
          CUDACXX: /usr/local/cuda/bin/nvcc
          CMAKE_CUDA_COMPILER: /usr/local/cuda/bin/nvcc
          # Same three consumer generations as build-cuda (Ampere/Ada/Blackwell).
          # WATCH POINT: TurboQuant v1.5.3 compiles 100+ fattn-vec kernel
          # instantiations with high register/shared-memory pressure. Older
          # arches (sm_86/sm_89) have less shared memory than sm_120, so if a
          # variant overflows shmem the nvcc compile will fail here. If that
          # happens, narrow this list (e.g. "89;120") and document Ampere
          # TurboQuant as build-from-source.
          CMAKE_CUDA_ARCHITECTURES: "86;89;120"

      - name: Test TurboQuant module
        run: |
          . "$HOME/.cargo/env"
          cargo test --features turboquant_native -p eullm-engine

      - name: Package binary
        run: |
          cp target/release/eullm ${{ matrix.artifact }}
          strip --strip-all ${{ matrix.artifact }} || true
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-metal-turboquant:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Cache cargo registry + vendor
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-macos-tq-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-macos-tq-

      - uses: actions/cache@v5
        id: vendor-cache-mac
        with:
          path: engine/vendor
          key: tq-vendor-macos-${{ hashFiles('engine/scripts/setup-turboquant.sh') }}

      # Cache Rust target/ directory
      - uses: actions/cache@v5
        with:
          path: target
          key: target-macos-arm64-tq-${{ hashFiles('Cargo.lock', 'engine/scripts/setup-turboquant.sh') }}
          restore-keys: |
            target-macos-arm64-tq-
            target-macos-arm64-

      # sccache: disk cache persisted via actions/cache — no GHA cache API dependency at runtime
      - uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: sccache-macos-arm64-tq-${{ hashFiles('Cargo.lock', 'engine/scripts/setup-turboquant.sh') }}
          restore-keys: sccache-macos-arm64-tq-

      - name: Install sccache
        run: |
          SCCACHE_VER=0.8.0
          TMPSC=$(mktemp -d)
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VER}/sccache-v${SCCACHE_VER}-aarch64-apple-darwin.tar.gz" \
            -o "${TMPSC}/sccache.tar.gz"
          tar -xzf "${TMPSC}/sccache.tar.gz" -C "${TMPSC}"
          find "${TMPSC}" -maxdepth 2 -name sccache -type f -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/sccache
          rm -rf "${TMPSC}"
          mkdir -p ~/.cache/sccache
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          sccache --version

      - name: Setup TurboQuant backend
        working-directory: engine
        run: |
          cargo fetch
          if [ "${{ steps.vendor-cache-mac.outputs.cache-hit }}" != "true" ]; then
            bash scripts/setup-turboquant.sh
          else
            echo "Vendor cache hit — skipping TurboQuant clone."
            if ! grep -q '^\[patch.crates-io\]' ../Cargo.toml; then
              bash scripts/setup-turboquant.sh
            fi
          fi
          echo "--- Verifying patch (workspace root) ---"
          grep -A2 'patch.crates-io' ../Cargo.toml || echo "NO PATCH FOUND"
          cargo tree -i llama-cpp-sys-2 2>&1 | head -5

      - name: Build engine with Metal + TurboQuant
        run: cargo build --release --target aarch64-apple-darwin --features "metal turboquant_native" -p eullm-engine

      - name: Test TurboQuant module
        run: cargo test --features turboquant_native -p eullm-engine

      - name: Package binary
        run: |
          cp target/aarch64-apple-darwin/release/eullm eullm-macos-arm64-turboquant-exp
          strip -x eullm-macos-arm64-turboquant-exp || true
          chmod +x eullm-macos-arm64-turboquant-exp

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eullm-macos-arm64-turboquant-exp
          path: eullm-macos-arm64-turboquant-exp

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      # sccache persisted via actions/cache
      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Mozilla\sccache
          key: sccache-x86_64-pc-windows-msvc-${{ hashFiles('Cargo.lock') }}
          restore-keys: sccache-x86_64-pc-windows-msvc-

      - name: Install sccache
        shell: pwsh
        run: |
          $SCCACHE_VER = "0.8.0"
          $url = "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VER/sccache-v$SCCACHE_VER-x86_64-pc-windows-msvc.tar.gz"
          $tmp = New-Item -ItemType Directory -Path "$env:TEMP\sccache-install" -Force
          Invoke-WebRequest -Uri $url -OutFile "$tmp\sccache.tar.gz"
          tar -xzf "$tmp\sccache.tar.gz" -C "$tmp"
          $exe = Get-ChildItem -Path $tmp -Recurse -Filter sccache.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "C:\Windows\System32\sccache.exe"
          "RUSTC_WRAPPER=sccache" | Add-Content -Path $env:GITHUB_ENV
          "CMAKE_C_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
          "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
          sccache --version

      - name: Build engine
        run: cargo build --release --target x86_64-pc-windows-msvc -p eullm-engine

      - name: Package binary
        shell: pwsh
        run: |
          Copy-Item "target\x86_64-pc-windows-msvc\release\eullm.exe" -Destination "eullm-windows-x64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eullm-windows-x64
          path: eullm-windows-x64.exe

  build-windows-cuda:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17.0"

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: "12.8.0"
          method: network
          # Sub-package filtering is deliberately omitted: NVIDIA's Windows
          # installer uses component names like "cudart_12.8" which differ
          # from Linux ("cudart"). Providing a Linux-style allowlist makes
          # the installer exit with code 3772776473. Letting Jimver install
          # the default set (~5 GB) is the most reliable path on Windows.

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc-cuda-12.8

      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Mozilla\sccache
          key: sccache-windows-cuda-${{ hashFiles('Cargo.lock') }}
          restore-keys: sccache-windows-cuda-

      - name: Install sccache
        shell: pwsh
        run: |
          $SCCACHE_VER = "0.8.0"
          $url = "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VER/sccache-v$SCCACHE_VER-x86_64-pc-windows-msvc.tar.gz"
          $tmp = New-Item -ItemType Directory -Path "$env:TEMP\sccache-install" -Force
          Invoke-WebRequest -Uri $url -OutFile "$tmp\sccache.tar.gz"
          tar -xzf "$tmp\sccache.tar.gz" -C "$tmp"
          $exe = Get-ChildItem -Path $tmp -Recurse -Filter sccache.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "C:\Windows\System32\sccache.exe"
          "RUSTC_WRAPPER=sccache" | Add-Content -Path $env:GITHUB_ENV
          "CMAKE_C_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
          "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
          sccache --version

      - name: Build engine with CUDA
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc --features cuda -p eullm-engine
        env:
          CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
          # Ampere (RTX 3000) + Ada (RTX 4000) + Blackwell (RTX 5000).
          CMAKE_CUDA_ARCHITECTURES: "86;89;120"

      - name: Package binary + bundle CUDA runtime DLLs
        shell: pwsh
        run: |
          # Windows links CUDA dynamically (NVIDIA ships DLLs, not static
          # libs), so eullm.exe needs the CUDA runtime DLLs next to it to
          # launch. We ship a ZIP containing the exe + the three DLLs that
          # llama.cpp inference actually loads. The user extracts and runs
          # eullm.exe from the same folder — no CUDA Toolkit install needed.
          $bundle = "eullm-windows-x64-cuda-12.8"
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\eullm.exe" -Destination "$bundle\eullm.exe"
          $cudaBin = "$env:CUDA_PATH\bin"
          # Copy by glob so we are resilient to the exact minor-version
          # suffix (cudart64_12.dll, cublas64_12.dll, cublasLt64_12.dll).
          Copy-Item "$cudaBin\cudart64_*.dll"   -Destination $bundle
          Copy-Item "$cudaBin\cublas64_*.dll"   -Destination $bundle
          Copy-Item "$cudaBin\cublasLt64_*.dll" -Destination $bundle
          Get-ChildItem $bundle | Format-Table Name, Length
          Compress-Archive -Path "$bundle\*" -DestinationPath "$bundle.zip" -Force
        env:
          CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eullm-windows-x64-cuda-12.8
          path: eullm-windows-x64-cuda-12.8.zip

  build-windows-cuda-turboquant:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17.0"

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: "12.8.0"
          method: network
          # See note in build-windows-cuda: sub-package filtering is unsafe
          # on Windows because component names differ from Linux. Default
          # set installs cleanly.

      - uses: actions/cache@v5
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
          key: cargo-registry-windows-cuda-tq-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-windows-cuda-tq-

      - uses: actions/cache@v5
        id: vendor-cache-win
        with:
          path: engine/vendor
          key: tq-vendor-windows-${{ hashFiles('engine/scripts/setup-turboquant.sh') }}

      - uses: actions/cache@v5
        with:
          path: target
          key: target-windows-cuda-tq-${{ hashFiles('Cargo.lock', 'engine/scripts/setup-turboquant.sh') }}
          restore-keys: |
            target-windows-cuda-tq-

      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Mozilla\sccache
          key: sccache-windows-cuda-tq-${{ hashFiles('Cargo.lock', 'engine/scripts/setup-turboquant.sh') }}
          restore-keys: |
            sccache-windows-cuda-tq-

      - name: Install sccache
        shell: pwsh
        run: |
          $SCCACHE_VER = "0.8.0"
          $url = "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VER/sccache-v$SCCACHE_VER-x86_64-pc-windows-msvc.tar.gz"
          $tmp = New-Item -ItemType Directory -Path "$env:TEMP\sccache-install" -Force
          Invoke-WebRequest -Uri $url -OutFile "$tmp\sccache.tar.gz"
          tar -xzf "$tmp\sccache.tar.gz" -C "$tmp"
          $exe = Get-ChildItem -Path $tmp -Recurse -Filter sccache.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "C:\Windows\System32\sccache.exe"
          "RUSTC_WRAPPER=sccache" | Add-Content -Path $env:GITHUB_ENV
          "CMAKE_C_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
          "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
          sccache --version

      - name: Setup TurboQuant backend
        shell: bash
        working-directory: engine
        run: |
          cargo fetch
          if [ "${{ steps.vendor-cache-win.outputs.cache-hit }}" != "true" ]; then
            bash scripts/setup-turboquant.sh
          else
            echo "Vendor cache hit — skipping TurboQuant clone."
            if ! grep -q '^\[patch.crates-io\]' ../Cargo.toml; then
              bash scripts/setup-turboquant.sh
            fi
          fi
          echo "--- Verifying patch (workspace root) ---"
          grep -A2 'patch.crates-io' ../Cargo.toml || echo "NO PATCH FOUND"
          cargo tree -i llama-cpp-sys-2 2>&1 | head -5

      - name: Create NCCL stub (TurboQuant v1.5.3 multi-GPU support)
        shell: pwsh
        run: |
          # TurboQuant v1.5.3 added multi-GPU AllReduce via NCCL.
          # NCCL is Linux-only — on Windows we provide no-op stubs so the
          # linker is satisfied; these are never called at runtime for
          # single-GPU inference (the only mode supported on Windows).
          $stub = @"
          #include <stddef.h>
          typedef int ncclResult_t;
          typedef void* ncclComm_t;
          typedef int ncclDataType_t;
          typedef int ncclRedOp_t;
          typedef void* cudaStream_t;
          __declspec(dllexport) ncclResult_t ncclCommInitAll(ncclComm_t* c, int n, const int* d) { (void)c;(void)n;(void)d; return 0; }
          __declspec(dllexport) const char* ncclGetErrorString(ncclResult_t r) { (void)r; return "nccl-stub"; }
          __declspec(dllexport) ncclResult_t ncclGroupStart(void) { return 0; }
          __declspec(dllexport) ncclResult_t ncclAllReduce(const void* s, void* r, size_t n, ncclDataType_t t, ncclRedOp_t op, ncclComm_t c, cudaStream_t st) { (void)s;(void)r;(void)n;(void)t;(void)op;(void)c;(void)st; return 0; }
          __declspec(dllexport) ncclResult_t ncclGroupEnd(void) { return 0; }
          "@
          $stubDir = "$env:GITHUB_WORKSPACE\nccl-stub"
          New-Item -ItemType Directory -Path $stubDir -Force | Out-Null
          $stub | Out-File -FilePath "$stubDir\nccl_stub.c" -Encoding ASCII
          # Locate cl.exe from the MSVC toolchain
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64"
          Push-Location $stubDir
          cl.exe /c /nologo nccl_stub.c /Fonccl_stub.obj
          Pop-Location
          "RUSTFLAGS=-C link-arg=$stubDir\nccl_stub.obj" | Add-Content -Path $env:GITHUB_ENV

      - name: Build engine with CUDA + TurboQuant
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc --features "cuda turboquant_native" -p eullm-engine
        env:
          CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
          # Same Ampere/Ada/Blackwell coverage as the Linux TurboQuant job.
          # See the WATCH POINT note there: older arches may overflow shmem
          # on the heavier TurboQuant kernels; narrow this list if nvcc fails.
          CMAKE_CUDA_ARCHITECTURES: "86;89;120"

      - name: Test TurboQuant module
        shell: pwsh
        run: cargo test --target x86_64-pc-windows-msvc --features turboquant_native -p eullm-engine

      - name: Package binary + bundle CUDA runtime DLLs
        shell: pwsh
        run: |
          # Same dynamic-linking rationale as build-windows-cuda: ship the
          # exe with the CUDA runtime DLLs it loads at launch, zipped.
          $bundle = "eullm-windows-x64-cuda12.8-turboquant-exp"
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\eullm.exe" -Destination "$bundle\eullm.exe"
          $cudaBin = "$env:CUDA_PATH\bin"
          Copy-Item "$cudaBin\cudart64_*.dll"   -Destination $bundle
          Copy-Item "$cudaBin\cublas64_*.dll"   -Destination $bundle
          Copy-Item "$cudaBin\cublasLt64_*.dll" -Destination $bundle
          Get-ChildItem $bundle | Format-Table Name, Length
          Compress-Archive -Path "$bundle\*" -DestinationPath "$bundle.zip" -Force
        env:
          CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eullm-windows-x64-cuda12.8-turboquant-exp
          path: eullm-windows-x64-cuda12.8-turboquant-exp.zip

  # ── Windows one-click installers ─────────────────────────────────────
  # Packages all three Windows binaries into self-contained .exe installers
  # via Inno Setup. Each installer creates Start Menu entries, optional PATH
  # entry, optional desktop shortcut, and a launcher that opens the embedded
  # chat UI in the user's browser.
  build-windows-installers:
    needs:
      - build-windows
      - build-windows-cuda
      - build-windows-cuda-turboquant
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Compute version from tag
        id: ver
        shell: pwsh
        run: |
          # Tags look like "EuLLM-v0.5.2" or "engine-v0.5.2" -> strip the prefix
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^(EuLLM-v|engine-v)', ''
          if (-not $version) { $version = "0.0.0" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Installer version: $version"

      - name: Download CPU artifact
        uses: actions/download-artifact@v6
        with:
          name: eullm-windows-x64
          path: dl/cpu
      - name: Download CUDA artifact
        uses: actions/download-artifact@v6
        with:
          name: eullm-windows-x64-cuda-12.8
          path: dl/cuda
      - name: Download CUDA+TurboQuant artifact
        uses: actions/download-artifact@v6
        with:
          name: eullm-windows-x64-cuda12.8-turboquant-exp
          path: dl/tq

      - name: Stage CPU bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\staging\cpu | Out-Null
          # CPU artifact is the bare .exe (named eullm-windows-x64.exe).
          # The installer expects it as eullm.exe.
          Copy-Item dl\cpu\eullm-windows-x64.exe installer\staging\cpu\eullm.exe
          Get-ChildItem installer\staging\cpu | Format-Table Name, Length

      - name: Stage CUDA bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\staging\cuda | Out-Null
          # CUDA artifact is the .zip — already contains eullm.exe + CUDA DLLs.
          Expand-Archive dl\cuda\eullm-windows-x64-cuda-12.8.zip -DestinationPath installer\staging\cuda -Force
          Get-ChildItem installer\staging\cuda | Format-Table Name, Length

      - name: Stage CUDA+TurboQuant bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\staging\tq | Out-Null
          Expand-Archive dl\tq\eullm-windows-x64-cuda12.8-turboquant-exp.zip -DestinationPath installer\staging\tq -Force
          Get-ChildItem installer\staging\tq | Format-Table Name, Length

      - name: Compile CPU installer
        shell: pwsh
        working-directory: installer
        run: |
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" `
              /DMyVariant=CPU `
              /DMyAppVersion=${{ steps.ver.outputs.version }} `
              /DMyStagingDir=staging\cpu `
              eullm.iss

      - name: Compile CUDA installer
        shell: pwsh
        working-directory: installer
        run: |
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" `
              /DMyVariant=CUDA `
              /DMyAppVersion=${{ steps.ver.outputs.version }} `
              /DMyStagingDir=staging\cuda `
              eullm.iss

      - name: Compile CUDA+TurboQuant installer
        shell: pwsh
        working-directory: installer
        run: |
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" `
              /DMyVariant=CUDA-TurboQuant `
              /DMyAppVersion=${{ steps.ver.outputs.version }} `
              /DMyStagingDir=staging\tq `
              eullm.iss

      - name: Show built installers
        shell: pwsh
        working-directory: installer\output
        run: Get-ChildItem | Format-Table Name, Length

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: eullm-windows-installers
          path: installer/output/*.exe

  release:
    needs:
      - build
      - build-cuda
      - build-cuda-turboquant
      - build-metal-turboquant
      - build-windows
      - build-windows-cuda
      - build-windows-cuda-turboquant
      - build-windows-installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            for file in "$dir"*; do
              sha256sum "$file" >> checksums.txt
            done
          done
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/eullm-linux-x64/eullm-linux-x64
            artifacts/eullm-linux-x64-cuda-12.8/eullm-linux-x64-cuda-12.8
            artifacts/eullm-linux-x64-cuda12.8-turboquant-exp/eullm-linux-x64-cuda12.8-turboquant-exp
            artifacts/eullm-macos-arm64-turboquant-exp/eullm-macos-arm64-turboquant-exp
            artifacts/eullm-linux-arm64/eullm-linux-arm64
            artifacts/eullm-macos-x64/eullm-macos-x64
            artifacts/eullm-macos-arm64/eullm-macos-arm64
            artifacts/eullm-windows-x64/eullm-windows-x64.exe
            artifacts/eullm-windows-x64-cuda-12.8/eullm-windows-x64-cuda-12.8.zip
            artifacts/eullm-windows-x64-cuda12.8-turboquant-exp/eullm-windows-x64-cuda12.8-turboquant-exp.zip
            artifacts/eullm-windows-installers/EuLLM-Setup-CPU-*.exe
            artifacts/eullm-windows-installers/EuLLM-Setup-CUDA-*.exe
            artifacts/eullm-windows-installers/EuLLM-Setup-CUDA-TurboQuant-*.exe
            artifacts/checksums.txt
          body: |
            ## EULLM Engine ${{ github.ref_name }}

            Drop-in Ollama replacement with continuous batching and EU AI Act audit trail.

            ### Quick install

            ```bash
            # Linux x64 (CPU only)
            curl -L https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-linux-x64 -o eullm
            chmod +x eullm

            # Linux x64 with NVIDIA GPU (CUDA 12.8 — supports RTX 3000/4000/5000 series)
            curl -L https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-linux-x64-cuda-12.8 -o eullm
            chmod +x eullm

            # macOS Apple Silicon
            curl -L https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-macos-arm64 -o eullm
            chmod +x eullm
            ```

            ```powershell
            # Windows x64 (CPU only) — PowerShell
            Invoke-WebRequest -Uri https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-windows-x64.exe -OutFile eullm.exe

            # Windows x64 with NVIDIA GPU (CUDA 12.8 — supports RTX 3000/4000/5000)
            # This is a ZIP: eullm.exe + the CUDA runtime DLLs it needs.
            Invoke-WebRequest -Uri https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-windows-x64-cuda-12.8.zip -OutFile eullm-cuda.zip
            Expand-Archive eullm-cuda.zip -DestinationPath eullm-cuda
            # Run eullm.exe from inside the extracted folder (the DLLs must
            # stay next to it).
            .\eullm-cuda\eullm.exe run model.gguf
            ```

            ### Which binary to download?

            | Binary | GPU Support | Requirements |
            |--------|-------------|--------------|
            | `eullm-linux-x64` | CPU only | None |
            | `eullm-linux-x64-cuda-12.8` | NVIDIA GPU (RTX 3000/4000/5000) | NVIDIA driver 570+ |
            | `eullm-linux-x64-cuda12.8-turboquant-exp` | NVIDIA GPU + TurboQuant KV cache | NVIDIA driver 570+ |
            | `eullm-linux-arm64` | CPU only | ARM64 Linux |
            | `eullm-macos-x64` | CPU only | macOS Intel |
            | `eullm-macos-arm64` | Metal (Apple GPU) | macOS Apple Silicon |
            | `eullm-macos-arm64-turboquant-exp` | Metal + TurboQuant KV cache | macOS Apple Silicon |
            | `eullm-windows-x64.exe` | CPU only | Windows 10/11 x64 |
            | `eullm-windows-x64-cuda-12.8.zip` | NVIDIA GPU (RTX 3000/4000/5000) | NVIDIA driver 570+ for Windows. ZIP bundles eullm.exe + CUDA DLLs — run from the extracted folder |
            | `eullm-windows-x64-cuda12.8-turboquant-exp.zip` | NVIDIA GPU + TurboQuant KV cache | NVIDIA driver 570+ for Windows. ZIP bundles eullm.exe + CUDA DLLs |

            ### TurboQuant (experimental)

            The `eullm-linux-x64-cuda12.8-turboquant-exp` build includes experimental
            KV cache compression based on Google's TurboQuant algorithm (ICLR 2026).

            **Important:**
            - Requires NVIDIA GPU with CUDA 12.8+ support
            - Experimental — may be unstable or change behavior between releases
            - Not recommended for production workloads
            - Use only for testing and benchmarking

            ```bash
            # Download TurboQuant build
            curl -L https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-linux-x64-cuda12.8-turboquant-exp -o eullm
            chmod +x eullm

            # Run with TurboQuant KV cache (4-bit, ~4x compression)
            ./eullm run model.gguf --cache-type-k tbq4_0 --cache-type-v tbq4_0
            ```

            ### Web browsing

            ```bash
            # Enable transparent web fetch (URLs in messages are fetched and injected)
            ./eullm run model.gguf --web
            ```

            ### Usage

            ```bash
            ./eullm run ./model.gguf                    # Run any GGUF model
            ./eullm run ./model.gguf --batch-size 16    # Continuous batching for RAG
            ./eullm run ./model.gguf --web              # Enable web browsing
            ```

            ### Verify checksums

            ```bash
            sha256sum -c checksums.txt
            ```
