name: Release Engine

on:
  push:
    tags:
      - "engine-v*"
      - "EuLLM-v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Force any JS-based action still pinned to Node 20 to run on Node 24.
  # Documented escape hatch from GitHub's Node 20 deprecation notice
  # (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/).
  # Needed today because KyleMayes/install-llvm-action has not yet shipped
  # a v3 with a Node 24 runtime — without this flag the workflow emits a
  # deprecation warning on every run and would break on June 16, 2026 when
  # Node 20 is forced off.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  # ── sccache → S3 backend on EU-hosted MinIO (ci.eullm.eu) ──────────────
  # WHY S3 and not GitHub's free Actions cache: the Actions cache is
  # REF-SCOPED. A run triggered by a tag (our releases fire on EuLLM-v*) can
  # only restore caches saved on that same tag ref or on the default branch —
  # NOT caches saved by other tags. So a GitHub-cache sccache never hits across
  # releases: v0.5.11 populated 865 MiB under its tag, v0.5.12 (different tag)
  # couldn't see it and rebuilt cold (38 min Linux CUDA). S3 is a GLOBAL,
  # content-addressed store with no ref boundary → it hits across every release
  # (proven in v0.5.9: 129 CUDA hits, 2m34s Linux CUDA, "Cache location: s3").
  # Do NOT move sccache back to the GitHub cache for the release workflow.
  SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
  SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
  SCCACHE_REGION: us-east-1
  SCCACHE_S3_USE_SSL: "true"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  # Keep the sccache daemon alive for the WHOLE build (default 600s idle
  # shutdown can kill long jobs mid-build, then a fresh daemon re-handshakes
  # with S3 and a blip prints "Timed out waiting for server startup").
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: eullm-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: eullm-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-15
            artifact: eullm-macos-x64
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: eullm-macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # sccache now uses S3 backend on our EU-hosted MinIO — no local
      # actions/cache layer needed. See workflow-level env block for config.

      - name: Install sccache
        shell: bash
        run: |
          SCCACHE_VER=0.8.0
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          if [ "$OS" = "linux" ]; then
            TRIPLE="x86_64-unknown-linux-musl"
          elif [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ]; then
            TRIPLE="aarch64-apple-darwin"
          else
            TRIPLE="x86_64-apple-darwin"
          fi
          # Use mktemp+find to avoid --wildcards which doesn't exist on BSD tar (macOS)
          TMPSC=$(mktemp -d)
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VER}/sccache-v${SCCACHE_VER}-${TRIPLE}.tar.gz" \
            -o "${TMPSC}/sccache.tar.gz"
          tar -xzf "${TMPSC}/sccache.tar.gz" -C "${TMPSC}"
          find "${TMPSC}" -maxdepth 2 -name sccache -type f -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/sccache
          rm -rf "${TMPSC}"
          # Route compiler invocations through sccache (configured via the
          # workflow-level SCCACHE_BUCKET / SCCACHE_ENDPOINT env vars).
          # Only route compilers through sccache if the S3 backend is actually
          # reachable. A backend outage must degrade to a cache-less (slower)
          # build, never fail it. (v0.5.5 died at exit 101 when the endpoint
          # vanished mid-build; this is the belt to that suspenders.)
          if curl -sSf -m 10 "${SCCACHE_ENDPOINT}/minio/health/live" >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "CMAKE_CUDA_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "sccache: S3 backend reachable — caching enabled."
          else
            echo "::warning::sccache S3 backend (${SCCACHE_ENDPOINT}) unreachable — building WITHOUT cache (slower, but the build will not fail)."
          fi
          sccache --version
          sccache --start-server || true
          sccache --show-stats || true

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential pkg-config libssl-dev

      - name: Build engine
        run: cargo build --release --target ${{ matrix.target }} -p eullm-engine

      - name: sccache stats (visibility into S3 hit/miss)
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Package binary
        run: |
          cp target/${{ matrix.target }}/release/eullm ${{ matrix.artifact }}
          strip --strip-all ${{ matrix.artifact }} 2>/dev/null || strip -x ${{ matrix.artifact }} 2>/dev/null || true
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-cuda:
    strategy:
      matrix:
        include:
          - cuda: "12.8.1"
            artifact: eullm-linux-x64-cuda-12.8
            cuda_tag: "12.8.1-devel-ubuntu22.04"

    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:${{ matrix.cuda_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl cmake build-essential pkg-config libssl-dev git libclang-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Cache cargo registry (works inside containers)
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-cuda-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-cuda-

      # Cache Rust target/ directory
      - uses: actions/cache@v5
        with:
          path: target
          key: target-cuda-${{ matrix.cuda }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-cuda-${{ matrix.cuda }}-

      # sccache now uses S3 backend (see workflow-level env block)

      - name: Install sccache
        run: |
          SCCACHE_VER=0.8.0
          TMPSC=$(mktemp -d)
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VER}/sccache-v${SCCACHE_VER}-x86_64-unknown-linux-musl.tar.gz" \
            -o "${TMPSC}/sccache.tar.gz"
          tar -xzf "${TMPSC}/sccache.tar.gz" -C "${TMPSC}"
          find "${TMPSC}" -maxdepth 2 -name sccache -type f -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/sccache
          rm -rf "${TMPSC}"
          # Only route compilers through sccache if the S3 backend is actually
          # reachable. A backend outage must degrade to a cache-less (slower)
          # build, never fail it. (v0.5.5 died at exit 101 when the endpoint
          # vanished mid-build; this is the belt to that suspenders.)
          if curl -sSf -m 10 "${SCCACHE_ENDPOINT}/minio/health/live" >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "CMAKE_CUDA_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "sccache: S3 backend reachable — caching enabled."
          else
            echo "::warning::sccache S3 backend (${SCCACHE_ENDPOINT}) unreachable — building WITHOUT cache (slower, but the build will not fail)."
          fi
          sccache --version
          sccache --start-server || true

      - name: Build engine with CUDA
        run: |
          . "$HOME/.cargo/env"
          export PATH="/usr/local/cuda/bin:$PATH"
          cargo build --release --features cuda -p eullm-engine
        env:
          CUDA_PATH: /usr/local/cuda
          CUDACXX: /usr/local/cuda/bin/nvcc
          CMAKE_CUDA_COMPILER: /usr/local/cuda/bin/nvcc
          # Fat binary covering the three consumer NVIDIA generations:
          #   sm_86  = Ampere      (RTX 3000 series)
          #   sm_89  = Ada Lovelace (RTX 4000 series)
          #   sm_120 = Blackwell    (RTX 5000 series)
          # cuBLAS static is the bulk of the binary and is shared across
          # archs, so adding two more arches grows the file by ~kernel
          # cubins only (~50-80 MB each), not 3x.
          CMAKE_CUDA_ARCHITECTURES: "86;89;120"
          # llama-cpp-sys-2 0.1.146 compiles ggml-cuda with NCCL on (option
          # GGML_CUDA_NCCL=ON in the vendored llama.cpp CMake). nvidia/cuda
          # 12.8-devel ships nccl.h + libnccl.so, so find_package(NCCL)
          # succeeds and GGML_USE_NCCL gets defined, pulling in
          # ggml_backend_cuda_allreduce_tensor with refs to ncclCommInitAll,
          # ncclAllReduce, ncclGroupStart/End, ncclGetErrorString. But the
          # crate's build.rs never emits `cargo:rustc-link-lib=nccl`, and
          # CMake links NCCL to ggml-cuda as PRIVATE, so the final rustc
          # link call sees those symbols undefined. Closing the gap here
          # keeps NCCL active (multi-GPU stays on the table) without
          # forking llama-cpp-sys-2. v0.5.15 shipped without this and the
          # build-cuda job failed at link.
          RUSTFLAGS: "-C link-arg=-lnccl"

      - name: sccache stats (visibility into S3 hit/miss)
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Package binary
        run: |
          cp target/release/eullm ${{ matrix.artifact }}
          strip --strip-all ${{ matrix.artifact }} || true
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Pre-release-only: Linux CUDA build with the `multimodal` cargo feature
  # enabled (mtmd vision/audio path). Mirrors build-cuda exactly except for
  # the features flag and artifact name; the cargo `multimodal` feature is
  # opt-in so the C++ mtmd code is only compiled here, never in stable.
  # Conditioned on the tag carrying -beta/-rc/-alpha to keep stable releases
  # text-only until the API surface (Phase 2) and continuous-batching
  # coexistence (Phase 3) land.
  build-cuda-multimodal:
    if: contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha')
    strategy:
      matrix:
        include:
          - cuda: "12.8.1"
            artifact: eullm-linux-x64-cuda-12.8-multimodal
            cuda_tag: "12.8.1-devel-ubuntu22.04"

    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:${{ matrix.cuda_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl cmake build-essential pkg-config libssl-dev git libclang-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-cuda-mm-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-cuda-mm-

      # Separate target cache from build-cuda: features changes invalidate
      # Cargo's fingerprint, so a shared target/ would just thrash. sccache
      # (content-addressed on C++/CUDA source) is still shared via S3.
      - uses: actions/cache@v5
        with:
          path: target
          key: target-cuda-mm-${{ matrix.cuda }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-cuda-mm-${{ matrix.cuda }}-

      - name: Install sccache
        run: |
          SCCACHE_VER=0.8.0
          TMPSC=$(mktemp -d)
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VER}/sccache-v${SCCACHE_VER}-x86_64-unknown-linux-musl.tar.gz" \
            -o "${TMPSC}/sccache.tar.gz"
          tar -xzf "${TMPSC}/sccache.tar.gz" -C "${TMPSC}"
          find "${TMPSC}" -maxdepth 2 -name sccache -type f -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/sccache
          rm -rf "${TMPSC}"
          if curl -sSf -m 10 "${SCCACHE_ENDPOINT}/minio/health/live" >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "CMAKE_CUDA_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
            echo "sccache: S3 backend reachable — caching enabled."
          else
            echo "::warning::sccache S3 backend (${SCCACHE_ENDPOINT}) unreachable — building WITHOUT cache (slower, but the build will not fail)."
          fi
          sccache --version
          sccache --start-server || true

      - name: Build engine with CUDA + multimodal (mtmd)
        run: |
          . "$HOME/.cargo/env"
          export PATH="/usr/local/cuda/bin:$PATH"
          cargo build --release --features "cuda,multimodal" -p eullm-engine
        env:
          CUDA_PATH: /usr/local/cuda
          CUDACXX: /usr/local/cuda/bin/nvcc
          CMAKE_CUDA_COMPILER: /usr/local/cuda/bin/nvcc
          CMAKE_CUDA_ARCHITECTURES: "86;89;120"
          # Same NCCL link patch as build-cuda — see that job for rationale.
          RUSTFLAGS: "-C link-arg=-lnccl"

      - name: sccache stats (visibility into S3 hit/miss)
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Package binary
        run: |
          cp target/release/eullm ${{ matrix.artifact }}
          strip --strip-all ${{ matrix.artifact }} || true
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      # sccache now uses S3 backend (see workflow-level env block)

      - name: Install sccache
        shell: pwsh
        run: |
          $SCCACHE_VER = "0.8.0"
          $url = "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VER/sccache-v$SCCACHE_VER-x86_64-pc-windows-msvc.tar.gz"
          $tmp = New-Item -ItemType Directory -Path "$env:TEMP\sccache-install" -Force
          Invoke-WebRequest -Uri $url -OutFile "$tmp\sccache.tar.gz"
          tar -xzf "$tmp\sccache.tar.gz" -C "$tmp"
          $exe = Get-ChildItem -Path $tmp -Recurse -Filter sccache.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "C:\Windows\System32\sccache.exe"
          sccache --version
          # Only route compilers through sccache if the S3 backend is actually
          # reachable. A backend outage must degrade to a cache-less (slower)
          # build, never fail it (cf. v0.5.5: endpoint gone mid-build → exit 101).
          $reachable = $false
          try {
              Invoke-WebRequest -Uri "${env:SCCACHE_ENDPOINT}/minio/health/live" -UseBasicParsing -TimeoutSec 10 | Out-Null
              $reachable = $true
          } catch { $reachable = $false }
          if ($reachable) {
              "RUSTC_WRAPPER=sccache" | Add-Content -Path $env:GITHUB_ENV
              "CMAKE_C_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
              "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
              "CMAKE_CUDA_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
              sccache --start-server
              Write-Host "sccache: S3 backend reachable — caching enabled."
          } else {
              Write-Host "::warning::sccache S3 backend (${env:SCCACHE_ENDPOINT}) unreachable — building WITHOUT cache (slower, but the build will not fail)."
          }

      - name: Build engine
        run: cargo build --release --target x86_64-pc-windows-msvc -p eullm-engine

      - name: sccache stats (visibility into S3 hit/miss)
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Package binary
        shell: pwsh
        run: |
          Copy-Item "target\x86_64-pc-windows-msvc\release\eullm.exe" -Destination "eullm-windows-x64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eullm-windows-x64
          path: eullm-windows-x64.exe

  build-windows-cuda:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17.0"

      # Ninja is the key to caching C++/CUDA on Windows: the default CMake
      # "Visual Studio" generator (MSBuild) silently ignores
      # CMAKE_*_COMPILER_LAUNCHER, so cl.exe and nvcc bypass sccache entirely.
      # Ninja honours those vars, which lets sccache content-hash every C++/CUDA
      # compile and route it to/from S3 just like on Linux. Proven in the
      # try-windows-ninja experiment (run #2): 205 C/C++ + 130 CUDA compiles
      # were tracked and written to S3, vs 0 with the VS generator.
      - name: Install Ninja
        run: choco install ninja --no-progress --yes
        shell: pwsh

      - name: Install CUDA toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: "12.8.0"
          method: network
          # Sub-package filtering is deliberately omitted: NVIDIA's Windows
          # installer uses component names like "cudart_12.8" which differ
          # from Linux ("cudart"). Providing a Linux-style allowlist makes
          # the installer exit with code 3772776473. Letting Jimver install
          # the default set (~5 GB) is the most reliable path on Windows.

      # MSVC env (vcvarsall) must be ACTIVE for Ninja to find cl.exe / nvcc.
      # Plain `runs-on: windows-2022` does NOT activate it — that's only set up
      # for MSBuild. We invoke vcvars64.bat directly (via vswhere to find the
      # VS install dir) and diff the resulting environment into $GITHUB_ENV so
      # every later step (cargo build → cmake → Ninja → cl.exe / nvcc) sees it.
      - name: Activate MSVC x64 dev environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -property installationPath
          if (-not $installPath) { throw "vswhere did not find a Visual Studio install" }
          $vcvars = "$installPath\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          Write-Host "Activating: $vcvars"
          $envBefore = @{}
          foreach ($e in (Get-ChildItem env:)) { $envBefore[$e.Name] = $e.Value }
          $output = cmd /c "`"$vcvars`" >NUL 2>&1 && set"
          foreach ($line in $output) {
              if ($line -match "^([^=]+)=(.*)$") {
                  $name = $matches[1]
                  $value = $matches[2]
                  if ($envBefore[$name] -ne $value) {
                      "$name=$value" | Add-Content -Path $env:GITHUB_ENV
                  }
              }
          }
          Write-Host "MSVC env activated."

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc-cuda-12.8

      # sccache now uses S3 backend (see workflow-level env block)

      - name: Install sccache
        shell: pwsh
        run: |
          $SCCACHE_VER = "0.8.0"
          $url = "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VER/sccache-v$SCCACHE_VER-x86_64-pc-windows-msvc.tar.gz"
          $tmp = New-Item -ItemType Directory -Path "$env:TEMP\sccache-install" -Force
          Invoke-WebRequest -Uri $url -OutFile "$tmp\sccache.tar.gz"
          tar -xzf "$tmp\sccache.tar.gz" -C "$tmp"
          $exe = Get-ChildItem -Path $tmp -Recurse -Filter sccache.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "C:\Windows\System32\sccache.exe"
          sccache --version
          # Only route compilers through sccache if the S3 backend is actually
          # reachable. A backend outage must degrade to a cache-less (slower)
          # build, never fail it (cf. v0.5.5: endpoint gone mid-build → exit 101).
          $reachable = $false
          try {
              Invoke-WebRequest -Uri "${env:SCCACHE_ENDPOINT}/minio/health/live" -UseBasicParsing -TimeoutSec 10 | Out-Null
              $reachable = $true
          } catch { $reachable = $false }
          if ($reachable) {
              "RUSTC_WRAPPER=sccache" | Add-Content -Path $env:GITHUB_ENV
              "CMAKE_C_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
              "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
              "CMAKE_CUDA_COMPILER_LAUNCHER=sccache" | Add-Content -Path $env:GITHUB_ENV
              sccache --start-server
              Write-Host "sccache: S3 backend reachable — caching enabled."
          } else {
              Write-Host "::warning::sccache S3 backend (${env:SCCACHE_ENDPOINT}) unreachable — building WITHOUT cache (slower, but the build will not fail)."
          }

      - name: Build engine with CUDA
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc --features cuda -p eullm-engine
        env:
          CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
          # Ampere (RTX 3000) + Ada (RTX 4000) + Blackwell (RTX 5000).
          CMAKE_CUDA_ARCHITECTURES: "86;89;120"
          # Force the Ninja generator (instead of the default VS/MSBuild one)
          # so sccache actually sees cl.exe + nvcc invocations and can cache
          # them — see "Install Ninja" step above for the full rationale.
          CMAKE_GENERATOR: Ninja

      - name: sccache stats (visibility into S3 hit/miss)
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Package binary + bundle CUDA runtime DLLs
        shell: pwsh
        run: |
          # Windows links CUDA dynamically (NVIDIA ships DLLs, not static
          # libs), so eullm.exe needs the CUDA runtime DLLs next to it to
          # launch. We ship a ZIP containing the exe + the three DLLs that
          # llama.cpp inference actually loads. The user extracts and runs
          # eullm.exe from the same folder — no CUDA Toolkit install needed.
          $bundle = "eullm-windows-x64-cuda-12.8"
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\eullm.exe" -Destination "$bundle\eullm.exe"
          $cudaBin = "$env:CUDA_PATH\bin"
          # Copy by glob so we are resilient to the exact minor-version
          # suffix (cudart64_12.dll, cublas64_12.dll, cublasLt64_12.dll).
          Copy-Item "$cudaBin\cudart64_*.dll"   -Destination $bundle
          Copy-Item "$cudaBin\cublas64_*.dll"   -Destination $bundle
          Copy-Item "$cudaBin\cublasLt64_*.dll" -Destination $bundle
          Get-ChildItem $bundle | Format-Table Name, Length
          Compress-Archive -Path "$bundle\*" -DestinationPath "$bundle.zip" -Force
        env:
          CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eullm-windows-x64-cuda-12.8
          path: eullm-windows-x64-cuda-12.8.zip

  release:
    needs:
      - build
      - build-cuda
      - build-cuda-multimodal
      - build-windows
      - build-windows-cuda
    # Run as long as at least one upstream job built something. We never
    # want a single failing build to nuke a release after CI on the others.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            for file in "$dir"*; do
              sha256sum "$file" >> checksums.txt
            done
          done
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Mark the GitHub Release as a pre-release when the tag carries a
          # pre-release suffix (-beta, -rc, -alpha). Stable tags like
          # EuLLM-v0.5.18 remain marked as "Latest release"; experimental
          # tags like EuLLM-v0.5.18-beta.1 surface in the Releases list but
          # never replace the Latest pointer downstream installers follow.
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          # Skip files that did not get produced (e.g. one build job failed)
          # so the release still publishes the binaries that built. The matrix
          # also tolerates entire upstream jobs being missing thanks to the
          # `if: !cancelled()` guard above.
          fail_on_unmatched_files: false
          files: |
            artifacts/eullm-linux-x64/eullm-linux-x64
            artifacts/eullm-linux-x64-cuda-12.8/eullm-linux-x64-cuda-12.8
            artifacts/eullm-linux-x64-cuda-12.8-multimodal/eullm-linux-x64-cuda-12.8-multimodal
            artifacts/eullm-linux-arm64/eullm-linux-arm64
            artifacts/eullm-macos-x64/eullm-macos-x64
            artifacts/eullm-macos-arm64/eullm-macos-arm64
            artifacts/eullm-windows-x64/eullm-windows-x64.exe
            artifacts/eullm-windows-x64-cuda-12.8/eullm-windows-x64-cuda-12.8.zip
            artifacts/checksums.txt
          body: |
            ## EULLM Engine ${{ github.ref_name }}

            Drop-in Ollama replacement with continuous batching and EU AI Act audit trail.

            ### Quick install

            ```bash
            # Linux x64 (CPU only)
            curl -L https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-linux-x64 -o eullm
            chmod +x eullm

            # Linux x64 with NVIDIA GPU (CUDA 12.8 — supports RTX 3000/4000/5000 series)
            curl -L https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-linux-x64-cuda-12.8 -o eullm
            chmod +x eullm

            # macOS Apple Silicon
            curl -L https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-macos-arm64 -o eullm
            chmod +x eullm
            ```

            ```powershell
            # Windows x64 (CPU only) — PowerShell
            Invoke-WebRequest -Uri https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-windows-x64.exe -OutFile eullm.exe

            # Windows x64 with NVIDIA GPU (CUDA 12.8 — supports RTX 3000/4000/5000)
            # This is a ZIP: eullm.exe + the CUDA runtime DLLs it needs.
            Invoke-WebRequest -Uri https://github.com/eullm/eullm/releases/download/${{ github.ref_name }}/eullm-windows-x64-cuda-12.8.zip -OutFile eullm-cuda.zip
            Expand-Archive eullm-cuda.zip -DestinationPath eullm-cuda
            # Run eullm.exe from inside the extracted folder (the DLLs must
            # stay next to it).
            .\eullm-cuda\eullm.exe run model.gguf
            ```

            ### Which binary to download?

            | Binary | GPU Support | Requirements |
            |--------|-------------|--------------|
            | `eullm-linux-x64` | CPU only | None |
            | `eullm-linux-x64-cuda-12.8` | NVIDIA GPU (RTX 3000/4000/5000) | NVIDIA driver 570+ |
            | `eullm-linux-arm64` | CPU only | ARM64 Linux |
            | `eullm-macos-x64` | CPU only | macOS Intel |
            | `eullm-macos-arm64` | Metal (Apple GPU) | macOS Apple Silicon |
            | `eullm-windows-x64.exe` | CPU only | Windows 10/11 x64 |
            | `eullm-windows-x64-cuda-12.8.zip` | NVIDIA GPU (RTX 3000/4000/5000) | NVIDIA driver 570+ for Windows. ZIP bundles eullm.exe + CUDA DLLs — run from the extracted folder |

            ### Pick a model interactively

            ```bash
            # Run with no arguments to open the model picker (local models + catalog)
            ./eullm
            ```

            ### Web browsing

            ```bash
            # Enable transparent web fetch (URLs in messages are fetched and injected)
            ./eullm run model.gguf --web
            ```

            ### Usage

            ```bash
            ./eullm run ./model.gguf                    # Run any GGUF model
            ./eullm run ./model.gguf --batch-size 16    # Continuous batching for RAG
            ./eullm run ./model.gguf --web              # Enable web browsing
            ```

            ### Verify checksums

            ```bash
            sha256sum -c checksums.txt
            ```
