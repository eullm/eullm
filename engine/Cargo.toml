[package]
name = "eullm-engine"
version = "0.6.70-rc14"
edition = "2024"
description = "eullm — sovereign LLM runtime for Europe"
license = "Apache-2.0"
repository = "https://github.com/eullm/eullm"

[[bin]]
name = "eullm"
path = "src/main.rs"

[features]
# Multimodal is on by default because every published binary carries it since
# 0.6.42, and a build from source that quietly cannot read an image while the
# download can is a difference nobody expects to have to know about. It was
# reported exactly that way: `--features vulkan` produced a binary that
# accepted an attached picture and answered "I cannot see the image".
# Opt out with --no-default-features when the mtmd build cost is unwanted.
default = ["multimodal"]
cuda = ["llama-cpp-2/cuda"]
rocm = ["llama-cpp-2/rocm"]
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]
# Native multimodal input (image + audio) via llama.cpp mtmd. Off by default —
# enable for the pre-release multimodal binary (cargo build --features
# "cuda,multimodal"). When off, all multimodal code paths are #[cfg]'d out
# and the build is identical to today's text-only engine.
multimodal = ["llama-cpp-2/mtmd"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.50", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
# Base64 decoding for `images: [...]` payloads on /api/chat (multimodal MVP).
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
llama-cpp-2 = { path = "vendor/llama-cpp-rs/llama-cpp-2", version = "0.1.151", features = ["sampler"] }
# Direct dependency (not just transitive via llama-cpp-2) so eullm can call
# llama_print_system_info() directly — see inference::cpu_features_summary.
# Same path as llama-cpp-2's own dependency, so Cargo unifies it into one
# instance; no separate C build.
llama-cpp-sys-2 = { path = "vendor/llama-cpp-rs/llama-cpp-sys-2", version = "0.1.151" }
encoding_rs = "0.8"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
async-stream = "0.3"
sha2 = "0.11.0"
ipnet = "2.12.0"
libc = "0.2"
# Line editing for the terminal chat: arrow keys that move the cursor, in-session
# history on up/down, and the ordinary emacs bindings. MIT licensed.
# `default-features = false` drops `with-file-history` on purpose — the default
# writes every line typed into a file under the user's home directory, and chat
# messages are not something to start persisting without being asked. History
# lives in memory and dies with the session.
rustyline = { version = "18.0.1", default-features = false }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
