[package]
name = "eullm-engine"
version = "0.2.97"
edition = "2021"
description = "eullm — sovereign LLM runtime for Europe"
license = "Apache-2.0"
repository = "https://github.com/eullm/eullm"

[[bin]]
name = "eullm"
path = "src/main.rs"

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
rocm = ["llama-cpp-2/rocm"]
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]
# Experimental: TurboQuant KV cache compression (Google, ICLR 2026).
# Enables tq3_0/tq4_0 cache types for --cache-type-k and --cache-type-v.
# Requires a TQ-capable llama.cpp backend; falls back to F16 otherwise.
turboquant = []
# Signals that the linked llama.cpp backend has native TurboQuant support
# (spiritbuun fork or upstream post-merge).  Without this, turboquant
# types are accepted but fall back to F16.  Set automatically by
# scripts/setup-turboquant.sh via the [patch] section.
turboquant_native = ["turboquant"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.50", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
llama-cpp-2 = { version = "0.1.140", features = ["sampler"] }
encoding_rs = "0.8"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
async-stream = "0.3"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

# ── TurboQuant backend (experimental) ───────────────────────────
# To enable TurboQuant, run: scripts/setup-turboquant.sh
# The script vendors llama-cpp-sys-2 with spiritbuun's fork and
# appends [patch.crates-io] to this file automatically.
# Then build with: cargo build --release --features "cuda turboquant_native"
