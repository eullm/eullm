[package]
name = "eullm-engine"
version = "0.6.23"
edition = "2024"
description = "eullm — sovereign LLM runtime for Europe"
license = "Apache-2.0"
repository = "https://github.com/eullm/eullm"

[[bin]]
name = "eullm"
path = "src/main.rs"

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
rocm = ["llama-cpp-2/rocm"]
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]
# Native multimodal input (image + audio) via llama.cpp mtmd. Off by default —
# enable for the pre-release multimodal binary (cargo build --features
# "cuda,multimodal"). When off, all multimodal code paths are #[cfg]'d out
# and the build is identical to today's text-only engine.
multimodal = ["llama-cpp-2/mtmd"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.50", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
# Base64 decoding for `images: [...]` payloads on /api/chat (multimodal MVP).
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
llama-cpp-2 = { path = "vendor/llama-cpp-rs/llama-cpp-2", version = "0.1.151", features = ["sampler"] }
encoding_rs = "0.8"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
async-stream = "0.3"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
