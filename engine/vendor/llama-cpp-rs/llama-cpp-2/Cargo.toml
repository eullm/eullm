# Brought to utilityai/llama-cpp-rs 0.1.161 @ e7af607 (2026-11-03) on
# 2026-11-11, with llama.cpp b12283, by porting its changes since 0.1.159:
# `RopeType::IMRope`. Its `with_tensor_split` and the MTP wrapper's own
# `common_batch` were here already (EuLLM's, ahead of upstream). Its build.rs
# changes are left out: WebAssembly/WebGPU, Android and PowerPC builds, none
# of which EuLLM makes.
#
# Vendored at utilityai/llama-cpp-rs 0.1.159 @ 3cfdd72 (2026-10-06), replacing
# the 0.1.156 vendoring at 63e5497 (2026-09-22), the 0.1.154 one at 09fc815d
# (2026-08-18) and, before that, the
# 2026-07-31 one at 8625c7c4 (see H3-P/H3-R/H3-Y in
# docs/backlog-fix-e-hardening.md).
#
# The llama.cpp submodule moved in the same change, to 7ab4ee7 (b11100,
# 2026-09-22) — the first time since 09fc815d that the two have moved
# together, which is the state to keep them in. The version above still dates
# the Rust crate and not the C++ tree, so read the pin from `git ls-tree HEAD
# engine/vendor/llama-cpp-rs/llama-cpp-sys-2/llama.cpp`, never from here.
#
# 0.1.159 is the redesign the 2026-10-03 bump held off: the token methods
# left `LlamaModel` for `LlamaVocab` (`model.vocab()`), pointers became a
# `Ptr` wrapper that keeps C++'s `const`, and `eval_chunks` takes its contexts
# mutably. The engine keeps its call sites through `engine/src/model_tokens.rs`,
# an extension trait over `LlamaModel` that is the old methods, one line each.
# Upstream's pin (llama.cpp 26394b4, 21 September) is older than ours, so the
# submodule did not move with it: the crate builds against the newer C API.
#
# The submodule is pinned to the llama.cpp commit that carries PR #29887 (the
# MoE expert cache, merged upstream on 7 October); read the exact commit from
# `git ls-tree HEAD engine/vendor/llama-cpp-rs/llama-cpp-sys-2/llama.cpp`.
# It is anchored on the mirror as refs/eullm/pinned/<sha>.
#
# Upstream has caught up past and superseded the three API patches the
# 2026-07-31 base needed (load_mode, mtmd_input_text.text_len,
# mtmd_helper_bitmap_wrapper); none of those remain. One API patch still
# does — `mtmd.rs`, in the list below.
#
# Re-vendor by three-way merge, not by copying upstream over this tree: take
# the upstream tag this comment names as the base, our tree as one side and
# the new tag as the other, and let git carry both. The 0.1.156 re-vendor was
# done that way and produced exactly one conflict (the de-inlined
# [workspace.dependencies] below); copying wholesale is what lost the
# additions in H3-Y.
#
# EuLLM ALSO carries whole functionality upstream doesn't have, on top of
# whichever base this comment names — every one of these must be re-applied
# by hand on the next re-vendor, the same way the API patches used to be.
# H3-Y lost these once (overwritten model.rs/wrapper_common.* wholesale,
# caught only at `cargo build`) precisely because this comment didn't list
# them yet. Keep this list current on every EuLLM addition to
# `llama-cpp-2`/`llama-cpp-sys-2`, not just API-compat patches:
#   - `model.rs`: `chat_parse`, `apply_jinja_chat_template`,
#     `apply_chat_template_oaicompat` (+ `JinjaChatTemplateResult`,
#     `OaiChatTemplateResult`) — the OpenAI tool-calling path (H4-A).
#   - `lib.rs`: `JinjaChatTemplateError`, the error type the three above use.
#   - `llama-cpp-sys-2/wrapper_common.h` + `.cpp`: the C wrapper functions
#     backing the three above — `llama_rs_apply_chat_template`,
#     `llama_rs_apply_chat_template_oai`, `llama_rs_chat_parse`.
#   - `context.rs`: `LlamaContext::memory_breakdown_print`, wrapping the
#     already-upstream `llama_rs_memory_breakdown_print` (declared in
#     `wrapper_common.h`, not itself an EuLLM addition) in a safe method —
#     only the Rust-side wrapper is ours.
#   - `llama-cpp-sys-2/wrapper_common.cpp`, `llama_rs_memory_breakdown_print`:
#     the verbosity-threshold raise/restore around the call (the table is
#     LOG_TRC-gated and would otherwise never print) is an EuLLM patch on a
#     wrapper whose one-line body is upstream's.
#   - `context/params/get_set.rs`: `with_n_outputs_max`/`n_outputs_max` —
#     upstream never exposed the raw struct's `n_outputs_max` field, and its
#     n_batch default costs ~300 MiB of compute buffer per loaded model for
#     callers that read one logit per sequence per step (see the method doc).
#   - `llama-cpp-sys-2/build.rs`: three CMake defines that are EuLLM policy
#     rather than upstream behaviour, each with its reasoning inline —
#     `GGML_METAL=OFF` whenever the `metal` feature is absent (ggml defaults it
#     ON for every Apple target), `GGML_CUDA_NCCL=OFF` under `cuda` (so the
#     binary doesn't hard-depend on libnccl.so.2 on single-GPU machines), and
#     `GPU_TARGETS`/`CMAKE_HIP_ARCHITECTURES` under `rocm` from
#     `EULLM_AMDGPU_TARGETS` (without it the HIP architecture is detected from
#     the build host's own GPUs, which is wrong on an HPC login node).
#   - `llama-cpp-sys-2/build.rs`: `-Wno-unused-function` on the wrapper and
#     compiles (the mtmd ones are CMake now) — llama.cpp's headers (clip-impl.h, miniaudio.h, jinja)
#     define static helpers most translation units never call, 700+ warnings
#     that cargo replayed on every build.
#   - `context/params/get_set.rs`: `with_non_causal_attention` /
#     `non_causal_attention` (`attention_type`), for the block-causal
#     attention of the Jev-Style 2B decision model.
#   - `context/kv_cache.rs`: `clear_kv_cache_cells` (`llama_memory_clear`
#     with `data = false`) — a recurrent or hybrid model's memory refuses
#     `seq_rm(-1, ...)`, so clearing every sequence needs it.
#   - `gguf/mod.rs`: `GgufContext::val_f32` / `val_f64` (`gguf_get_val_f32`
#     / `_f64`) — a float metadata value read with its type and in full:
#     `LlamaModel::meta_val_str` prints any float to six decimals. A decision
#     model's calibration temperature (`eullm.decision.temperature`) is read
#     with them; the engine's tests on that read cover both.
#   - `model.rs`: `LlamaModel::n_layer_nextn` (`llama_model_n_layer_nextn`):
#     whether a model has multi-token prediction layers (`with_load_mtp`,
#     which loads them, is upstream's since 0.1.158).
#   - `speculative.rs`: `MtpDrafter`, upstream's MTP drafter
#     (`llama_rs_mtp_speculative_*`) without `MtpSpeculative`'s ownership of
#     the two contexts — the engine's scheduler owns, decodes with and trims
#     its target context itself, and keeps the drafter beside it.
#   - `llama-cpp-sys-2/wrapper_common.cpp`, `llama_rs_mtp_speculative_process`:
#     since b11370 `common_speculative_process` takes a `common_batch`, not a
#     `llama_batch`; the target's batch is copied into one the wrapper keeps.
#     An API-compat patch: upstream llama-cpp-rs still targets b11074.
#   - `context/params/get_set.rs`: `with_moe_cache_size` / `moe_cache_size`
#     (`moe_cache_size`), the GPU cache for MoE experts kept in host memory:
#     the field of llama.cpp PR #29887, merged upstream on 7 October.
#   - `context/params/get_set.rs`: `with_moe_prefetch_slots` /
#     `moe_prefetch_slots` (`moe_prefetch_slots`), the VRAM slots the experts
#     of a long prompt are copied into ahead of their layer. The field is
#     EuLLM's own, added by patch `0003`; it goes with that patch.
#   - `llama-cpp-sys-2/llama_patches.rs` and `llama-cpp-sys-2/patches/`:
#     EuLLM's own changes to llama.cpp, as patch files the build script
#     applies to a copy of the submodule in OUT_DIR (CMake, the wrappers,
#     mtmd and bindgen all build from that copy; the submodule stays clean).
#     `build.rs` calls it right after its rerun-if-changed walk, which also
#     covers `include/` and `ggml/include/` now; the wrapper sources are read
#     from beside the copy, and `CMakeCache.txt` from another source directory
#     resets the build directory. On a bump, `engine/tests/llama_patches.rs`
#     says whether every patch still applies; regenerate the ones that do not
#     against the new pin, and drop the ones upstream has taken.
[package]
name = "llama-cpp-2"
description = "llama.cpp bindings for Rust"
version = "0.1.161"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/utilityai/llama-cpp-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
enumflags2 = "0.7.12"
llama-cpp-sys-2 = { path = "../llama-cpp-sys-2", version = "0.1.161" }
# EuLLM vendoring: this crate lives under the workspace root (so Cargo treats
# it as a member) but the EuLLM root defines no [workspace.dependencies]; the
# upstream `{ workspace = true }` inheritance is de-inlined to upstream's exact
# values (utilityai/llama-cpp-rs 0.1.159 [workspace.dependencies],
# unchanged since 0.1.154).
thiserror = "2"
tracing = "0.1"
tracing-core = "0.1"
encoding_rs = "0.8.35"
llguidance = { version = "1.7.5", optional = true }
toktrie = { version = "1.7.5", optional = true }

[dev-dependencies]
encoding_rs = "0.8.35"
tracing-subscriber = { version = "0.3", features = ["json"] }
static_assertions = "1.1.0"

[features]
default = ["openmp", "android-shared-stdcxx", "common"]
# Enable the JSON-schema-to-grammar API. Backed by `llama.cpp`'s `common/`
# static library; disabling drops `libcommon.a` (~14 MB) plus the
# `wrapper_common.cpp` bindings from the link line. Enabled by default for
# backwards compatibility.
common = ["llama-cpp-sys-2/common"]
cuda = ["llama-cpp-sys-2/cuda"]
cuda-no-vmm = ["cuda", "llama-cpp-sys-2/cuda-no-vmm"]
metal = ["llama-cpp-sys-2/metal"]
dynamic-link = ["llama-cpp-sys-2/dynamic-link"]
vulkan = ["llama-cpp-sys-2/vulkan"]
opencl = ["llama-cpp-sys-2/opencl"]
openmp = ["llama-cpp-sys-2/openmp"]
# Link GNU OpenMP (`libgomp`) statically on GNU targets while keeping OpenMP
# enabled. Useful for self-contained downstream binaries.
static-openmp = ["llama-cpp-sys-2/static-openmp"]
rocm = ["llama-cpp-sys-2/rocm"]
mkl = ["llama-cpp-sys-2/mkl"]
sampler = []
# Only has an impact on Android.
android-shared-stdcxx = ["llama-cpp-sys-2/shared-stdcxx"]
android-static-stdcxx = ["llama-cpp-sys-2/static-stdcxx"]
# Generic alias for non-Android targets that also support static C++ stdlib
# linkage through the sys crate.
static-stdcxx = ["llama-cpp-sys-2/static-stdcxx"]
mtmd = ["llama-cpp-sys-2/mtmd"]
system-ggml = ["llama-cpp-sys-2/system-ggml"]
system-ggml-static = ["llama-cpp-sys-2/system-ggml-static"]
llguidance = ["dep:llguidance", "dep:toktrie"]
dynamic-backends = ["llama-cpp-sys-2/dynamic-backends"]


[target.'cfg(all(target_os = "macos", any(target_arch = "aarch64", target_arch = "arm64")))'.dependencies]
llama-cpp-sys-2 = { path = "../llama-cpp-sys-2", version = "0.1.161", features = [
    "metal",
] }

# [lints] workspace = true removed: the EuLLM root workspace defines no
# [workspace.lints]; the CI/release clippy step lints only our own crates via
# `clippy --no-deps`, so the upstream pedantic gate never applies here.

[package.metadata.docs.rs]
features = ["sampler"]

# Upstream's [[example]] targets (../examples/*.rs) are dropped: the examples/
# directory is not vendored, so those paths do not exist in this tree.
