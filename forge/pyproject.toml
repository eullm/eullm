[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eullm-forge"
version = "0.1.0"
description = "EULLM Forge — compress, customize, and brand open-source LLMs"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "EULLM Team", email = "dev@eullm.eu" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.18",
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "spacy>=3.7,<4",
    "datasketch>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
distill = [
    "nvidia-modelopt[torch]>=0.11",
]
datasets-browser = [
    "playwright>=1.40",
]
# Italian legal-domain NER: pulls the spaCy model from the official
# release page so `pip install eullm-forge[legal]` is self-sufficient.
# If the pinned URL 404s, fall back to: python -m spacy download it_core_news_lg
legal = [
    "it-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/it_core_news_lg-3.7.0/it_core_news_lg-3.7.0-py3-none-any.whl",
]

[tool.setuptools.packages.find]
include = ["eullm_forge*"]

[project.scripts]
eullm-forge = "eullm_forge.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
