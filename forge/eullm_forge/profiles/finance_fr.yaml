# EULLM Forge profile: French Finance
name: finance-fr
description: "Verticalizzato for French finance domain — AMF regulations, BCE directives, banking"
base_model: Qwen/Qwen3-14B
languages:
  - fr
  - en
target_vram_gb: 8

pruning:
  target_ratio: 0.5
  strategy: mlp_first
  calibration_samples: 512
  calibration_dataset: finance_fr

distillation:
  temperature: 2.0
  alpha: 0.5
  num_epochs: 3
  dataset: finance_fr
  max_tokens: 50_000_000_000

quantization:
  bits: 4
  group_size: 128
  method: awq

identity:
  identity_name: "EULLM Finance FR"
  lora_rank: 16
  lora_alpha: 32
  num_epochs: 3

export:
  format: gguf
  quantization: q4_k_m
