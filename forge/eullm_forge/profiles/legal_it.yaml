# EULLM Forge profile: Italian Legal
name: legal-it
description: "Verticalizzato for Italian legal domain — civil code, criminal code, GDPR, Cassazione rulings"
base_model: Qwen/Qwen3-14B
languages:
  - it
  - en
target_vram_gb: 8

pruning:
  target_ratio: 0.5
  strategy: mlp_first
  calibration_samples: 512
  calibration_dataset: legal_it

distillation:
  temperature: 2.0
  alpha: 0.5
  num_epochs: 3
  dataset: legal_it
  max_tokens: 50_000_000_000

quantization:
  bits: 4
  group_size: 128
  # 'none' for GGUF deliverables: llama-quantize in the export stage does
  # the quantizing (export.quantization below). AWQ/GPTQ target GPU
  # runtimes (vLLM/TensorRT) and cannot be converted to GGUF.
  method: none

identity:
  identity_name: "EULLM Legal IT"
  lora_rank: 16
  lora_alpha: 32
  num_epochs: 3

export:
  format: gguf
  quantization: q4_k_m
