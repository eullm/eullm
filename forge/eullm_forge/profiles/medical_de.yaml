# EULLM Forge profile: German Medical
name: medical-de
description: "Verticalizzato for German medical domain — clinical guidelines, medical documentation"
base_model: Qwen/Qwen3-14B
languages:
  - de
  - en
target_vram_gb: 8

pruning:
  target_ratio: 0.5
  strategy: mlp_first
  calibration_samples: 512
  calibration_dataset: medical_de

distillation:
  temperature: 2.0
  alpha: 0.5
  num_epochs: 3
  dataset: medical_de
  max_tokens: 50_000_000_000

quantization:
  bits: 4
  group_size: 128
  method: awq

identity:
  identity_name: "EULLM Medical DE"
  lora_rank: 16
  lora_alpha: 32
  num_epochs: 3

export:
  format: gguf
  quantization: q4_k_m
