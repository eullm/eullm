# Phase 2 — Knowledge distillation Qwen3-32B-legal-it → Qwen3-7B-Base.
#
# A frozen teacher (Phase-1 LoRA-merged 32B) generates soft probability
# distributions over each next token; the student (7B) is trained to
# imitate them via KL divergence plus a fraction of standard CE.
#
# Loss = α · KL(student || teacher) · T² + (1-α) · CE(student, y)
#
# ─── Memory budget ─────────────────────────────────────────────────────
# DEFAULT (LoRA student r=128 on 7B + teacher BF16): targets a 94-96 GB
# single GPU (H100 NVL, RTX PRO 6000 Blackwell). Numbers below are
# back-of-envelope, gradient checkpointing on, cutoff_len 2048.
#
#   teacher 32B BF16 (frozen, no grad)            ~64 GB
#   student 7B BF16 (frozen base)                 ~14 GB
#   student LoRA r=128 + grad + 8-bit Adam         ~6 GB
#   activations + KL buffers                       ~10 GB
#   misc / fragmentation                           ~2 GB
#   ────────                                      ─────
#   total                                         ~96 GB ✅
#
# If memory is still tight on 94 GB, set teacher_load_in_4bit: true to
# drop the teacher to ~16 GB. The distillation literature shows this is
# acceptable — the student copies the teacher's distribution shape, not
# the high-precision logit tail.
#
# For FULL fine-tuning of the student (7B, no LoRA), VRAM peak is
# ~155 GB — out of reach for any single 96 GB GPU. Switch to:
#   * an H200 141 GB instance + teacher_load_in_4bit (fits ~115 GB), or
#   * a multi-GPU setup with FSDP (out of scope for v0.1)
# and set student_finetune: full below.
#
# Expected wall time: 5-7 days on a 94-96 GB single GPU at
# ~1500 effective tokens/sec (forward of the 32B teacher dominates).
# ───────────────────────────────────────────────────────────────────────

### models
teacher_model: Qwen/Qwen3-32B-Base
# Phase-1 LoRA adapter directory; the script loads it with PeftModel and
# merge_and_unload's it into the base before forward, so the teacher
# behaves like a single legal-tuned 32B without runtime LoRA overhead.
teacher_adapter: ~/checkpoints/qwen3_32b_legal_it_continued_pt
student_model: Qwen/Qwen3-7B-Base
teacher_load_in_8bit: false
teacher_load_in_4bit: false   # flip to true if 94 GB GPU is still tight

### student fine-tuning method
# v0.1: LoRA student keeps total VRAM ≤ 96 GB and gives ~95% of the
# quality of full fine-tuning at ~5% of the trainable params count.
# Switch to "full" only on a 141 GB+ GPU or a multi-GPU FSDP setup.
student_finetune: lora
student_lora_rank: 128
student_lora_alpha: 256
student_lora_dropout: 0.0
student_lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

### data
dataset_dir: ~/datasets/legal_it
train_file: train.jsonl
val_file: val.jsonl
cutoff_len: 2048
max_train_samples: null   # null = full corpus

### training
output_dir: ~/checkpoints/qwen3_7b_legal_it_distilled
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
num_train_epochs: 1
max_steps: -1             # -1 = unlimited (full epoch)
warmup_steps: 1000
save_steps: 1000
eval_steps: 1000
logging_steps: 20

### distillation
kl_temperature: 2.0
kl_alpha: 0.7   # 0.7 KL + 0.3 CE — KL-heavy at the start, can be
                # decreased later if the student plateaus on CE.

### hardware
bf16: true
gradient_checkpointing: true
seed: 42
